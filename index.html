<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dermawan — Dunia 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;color:#3d4a6b;overflow:hidden;
  background:linear-gradient(180deg,#3f9be0 0%,#8ecdf7 45%,#fdf3df 100%);transition:background .6s}
canvas{display:block;touch-action:none}
.world{position:fixed;inset:0;display:none}
.world.active{display:block}
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.brand{background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(61,74,107,.15)}
.brand b{color:#ff8f6b}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.75);border-radius:999px;padding:5px;box-shadow:0 6px 20px rgba(61,74,107,.12)}
.tab{border:0;background:transparent;font:inherit;font-weight:700;color:#3d4a6b;padding:8px 18px;border-radius:999px;cursor:pointer}
.tab.active{background:#ff8f6b;color:#fff}
.tab.two.active{background:#8b7cf6}
.links{margin-left:auto;display:flex;gap:8px}

.hint{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(61,74,107,.1);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}

#panel h2{margin:0 0 4px;font-size:20px;line-height:1.25}

.dpad button[data-d="left"]{grid-column:1;grid-row:2}
.dpad button[data-d="right"]{grid-column:3;grid-row:2}

<script>
const $=id=>document.getElementById(id);

/* ---------- data info (semua data nyata) ---------- */
const INFO={
  home:{title:'Halo, saya Dermawan',text:'SPV Maintenance Planner di Kalimantan Utara & AI enthusiast. Satu gunung untuk semuanya — dari base camp sampai puncak, tiap pos bercerita tentang saya dan proyek yang saya bangun.'},
  avatar:{title:'Halo! Saya Dermawan',text:'Senang bertemu di dunia saya! Sehari-hari saya merencanakan perawatan alat berat dan plant tambang — dan di luar itu saya membangun web app dengan bantuan AI agent.'},
  tentang:{title:'Tentang saya',text:'Saya Dermawan Purba. Sehari-hari merencanakan perawatan alat berat dan plant tambang. Di luar itu saya membangun web app dengan AI agent — dari nol sampai live.'},
  pendidikan:{title:'Pendidikan',text:'S1 Teknik Industri, Universitas Mulawarman. Sekarang semester 4 S2 Magister Manajemen di Universitas Ciputra Surabaya (kuliah online). Belajar terus, sambil kerja.'},
  pekerjaan:{title:'Pekerjaan',text:'SPV Maintenance Planner — memastikan alat dan plant tambang siap kerja: jadwal perawatan, suku cadang, dan tim lapangan.'},

  projects:{title:'Proyek yang saya bangun',text:'Enam proyek nyata — web app, visualisasi data, game, sampai tools open source. Ketuk salah satu bangunan untuk melihat detail dan tautannya.'},
  aiuntuksemua:{title:'AI Untuk Semua',text:'Web app realtime & scalable untuk operasional tambang nikel dan batubara: dashboard, LMS, dan dokumen pengiriman. Dibangun dengan Hono + SQLite + React.',url:'https://www.aiuntuksemua.my.id',label:'Buka aiuntuksemua.my.id'},
  minechart:{title:'MineChart.studio',text:'Pustaka visualisasi data untuk 13 departemen pertambangan — 134 grafik, 28 jenis. Tiap peran bisa lihat grafik yang ia butuhkan.',url:'https://dermawanpurba.github.io/MineChart.studio/',label:'Buka MineChart.studio'},
  pulau:{title:'Pulau Komunitas 3D',text:'Game survival pulau 3D di browser: mancing, berkebun, masak, dan multiplayer dengan room code. NPC Budi, Siti, dan Rama menemani di pulau.',url:'https://dermawanpurba.github.io/Game-komunitas/',label:'Main gamenya'},
  mission:{title:'Mission Control',text:'Dashboard tim AI agent saya: Anca (PM), Tono (riset), Dani (coding), Cipu (video), Jaka (QC), Mu (UI/UX). Semua tugas dan obrolan tim tercatat di sini.',url:'https://www.myjarvis.my.id',label:'Buka Mission Control'},
  sheet:{title:'Sheet-manager',text:'Buka backup SQLite ERP sebagai grid ala Google Sheets: bisa edit, simpan kembali ke SQLite, dan ekspor JSON + dump MySQL. Dibangun dengan PHP.',url:'https://github.com/Dermawanpurba/Sheet-manager',label:'Lihat di GitHub'},
  openidm:{title:'open-idm',text:'Alternatif Internet Download Manager yang open source. Unduh file lebih cepat, gratis, dan kodenya terbuka untuk siapa saja.',url:'https://github.com/Dermawanpurba/open-idm',label:'Lihat di GitHub'}
};
function showInfo(key,zoomIn){
  const d=INFO[key]; if(!d) return;
  $('pTitle').textContent=d.title;
  $('pText').textContent=d.text;
  const a=$('pLink');
  if(d.url){a.href=d.url;a.textContent=d.label||'Buka';a.classList.remove('hide');}
  else a.classList.add('hide');
  $('panel').classList.remove('hide');
  if(zoomIn&&orbit1)orbit1.setRadius(13);
  updateDpad();
}
function hidePanel(){
  $('panel').classList.add('hide');
  if(orbit1){const b=(innerWidth/innerHeight<0.75)?0.9:1;orbit1.setRadius(24*b);}
  updateDpad();
}
$('pClose').addEventListener('click', hidePanel);

/* ---------- helper 3D ---------- */
function mat(color,rough){return new THREE.MeshStandardMaterial({color:color,roughness:(rough===undefined?0.85:rough),metalness:0});}
function ball(r,color,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function cyl(rt,rb,h,color,x,y,z,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function cone(r,h,color,x,y,z){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,24),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function labelSprite(text,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const g=c.getContext('2d');
  g.fillStyle=bg||'#ffffff';roundRect(g,6,14,500,100,46);g.fill();
  g.fillStyle=fg||'#3d4a6b';g.font='800 44px "Baloo 2", system-ui, sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,66);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(3.4,0.85,1);return sp;
}
function noticeBoard(key){
  const d=INFO[key];if(!d)return new THREE.Group();
  const c=document.createElement('canvas');c.width=512;c.height=352;
  const g=c.getContext('2d');
  g.fillStyle='#fff8ec';g.fillRect(0,0,512,352);
  g.strokeStyle='#8a5a3b';g.lineWidth=12;g.strokeRect(6,6,500,340);
  g.fillStyle='#3d4a6b';g.font='800 42px "Baloo 2", system-ui, sans-serif';
  g.textAlign='center';g.textBaseline='top';
  g.fillText(d.title,256,22);
  g.fillStyle='#4a5568';g.font='27px system-ui, sans-serif';g.textAlign='left';
  const words=d.text.split(' ');
  let line='',y=86;
  for(let i=0;i<words.length;i++){
    const t=line?line+' '+words[i]:words[i];
    if(g.measureText(t).width>452&&line){g.fillText(line,30,y);line=words[i];y+=34;if(y>300)break;}
    else line=t;
  }
  if(line&&y<=300)g.fillText(line,30,y);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const grp=new THREE.Group();
  grp.add(box(2.9,2.3,0.12,0x8a5a3b,0,1.6,0));
  const paper=new THREE.Mesh(new THREE.PlaneGeometry(2.66,1.83),new THREE.MeshBasicMaterial({map:tex}));
  paper.position.set(0,1.6,0.07);grp.add(paper);
  const texBack=new THREE.CanvasTexture(c);texBack.anisotropy=4;
  const paperBack=new THREE.Mesh(new THREE.PlaneGeometry(2.66,1.83),new THREE.MeshBasicMaterial({map:texBack}));
  paperBack.position.set(0,1.6,-0.07);paperBack.rotation.y=Math.PI;grp.add(paperBack);
  grp.add(box(0.14,0.9,0.14,0x8a5a3b,-1.15,0.45,0));
  grp.add(box(0.14,0.9,0.14,0x8a5a3b,1.15,0.45,0));
  grp.userData.key=key;
  return grp;
}
function glowSprite(color){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,color);gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  return sp;
}

/* ---------- orbit seret + zoom + ketuk ---------- */
function createOrbit(canvas,camera,target,opts){
  let theta=(opts.theta!==undefined?opts.theta:0.6),phi=opts.phi||1.05,radius=opts.radius||15;
  const baseR=radius,minR=opts.minR||9,maxR=opts.maxR||24,minPhi=0.4,maxPhi=1.35;
  const pointers=new Map();
  let lx=0,ly=0,moved=0,downT=0,pinchD=0;
  function apply(){
    phi=Math.max(minPhi,Math.min(maxPhi,phi));
    radius=Math.max(minR,maxR*0.2,Math.min(maxR,radius));
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta),
      target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  function ptrDist(){
    const a=[...pointers.values()];
    return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
  canvas.addEventListener('pointerdown',function(e){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){lx=e.clientX;ly=e.clientY;moved=0;downT=performance.now();}
    if(pointers.size===2)pinchD=ptrDist();
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  });
  canvas.addEventListener('pointermove',function(e){
    if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const d=ptrDist();
      if(pinchD>0){radius*=pinchD/d;apply();}
      pinchD=d;return;
    }
    if(pointers.size===1){
      const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
      theta-=dx*0.005;phi-=dy*0.004;apply();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size===0){
      if(moved<8&&performance.now()-downT<400&&opts.onTap)opts.onTap(e);
      pinchD=0;
    }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',function(e){e.preventDefault();radius*=(1+Math.sign(e.deltaY)*0.08);apply();},{passive:false});
  apply();
  return {apply:apply,setRadius:function(r){radius=r;apply();},addTheta:function(d){theta+=d;apply();},baseR:baseR,getTheta:function(){return theta;}};
}
const _rc=new THREE.Raycaster();
function pick(e,canvas,camera,roots){
  const r=canvas.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera);
  const hits=_rc.intersectObjects(roots,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&!o.userData.key)o=o.parent;
  return o;
}
function makeRenderer(canvas){
  const r=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  r.shadowMap.enabled=true;
  r.shadowMap.type=THREE.PCFSoftShadowMap;
  return r;
}
function addLights(scene){
  scene.add(new THREE.HemisphereLight(0xfff6e0,0x9fd8a8,0.85));
  const sun=new THREE.DirectionalLight(0xfff2cc,0.95);
  sun.position.set(6,10,4);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-22;sun.shadow.camera.right=22;
  sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;
  sun.shadow.camera.far=30;
  scene.add(sun);
}

/* ---------- avatar lucu ---------- */
function faceTexture(){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const g=c.getContext('2d');
  g.clearRect(0,0,128,128);
  g.strokeStyle='#22242a';g.lineWidth=9;g.lineCap='round';
  g.beginPath();g.arc(64,62,26,Math.PI*0.15,Math.PI*0.85);g.stroke();
  return new THREE.CanvasTexture(c);
}
function buildAvatar(){
  const g=new THREE.Group();
  const yel=0xf5cd30,blu=0x0d69ac,grn=0xa4bd47,amber=0xf59e0b,dark=0x22242a;
  function leg(side){
    const p=new THREE.Group();p.position.set(0.2*side,0.78,0);
    p.add(box(0.34,0.78,0.38,grn,0,-0.39,0));
    return p;
  }
  const legL=leg(-1),legR=leg(1);
  const body=box(0.92,0.86,0.5,blu,0,1.21,0);
  function arm(side){
    const p=new THREE.Group();p.position.set(0.63*side,1.6,0);
    p.add(box(0.3,0.8,0.34,yel,0,-0.4,0));
    return p;
  }
  const armL=arm(-1),armR=arm(1);
  const head=new THREE.Group();head.position.set(0,1.64,0);
  head.add(box(0.62,0.58,0.58,yel,0,0.29,0));
  head.add(box(0.68,0.13,0.62,amber,0,0.64,0));
  head.add(box(0.68,0.06,0.3,amber,0,0.58,0.38));
  const face=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5),new THREE.MeshBasicMaterial({map:faceTexture(),transparent:true}));
  face.position.set(0,0.3,0.3);head.add(face);
  const eyeL=box(0.09,0.14,0.03,dark,-0.13,0.38,0.32);
  const eyeR=box(0.09,0.14,0.03,dark,0.13,0.38,0.32);
  head.add(eyeL,eyeR);
  g.add(legL,legR,body,armL,armR,head);
  g.rotation.y=0;
  g.userData.key='avatar';
  return {group:g,armR:armR,armL:armL,legL:legL,legR:legR,head:head,eyeL:eyeL,eyeR:eyeR};
}

/* ---------- DUNIA 1: pulauku (branding / CV) ---------- */
const W1={clickables:[],clouds:[],landings:[],trees:[],steps:[],path:[],solids:[]};
let renderer1,scene1,camera1,avatar;
function buildWorld1(){
  scene1=new THREE.Scene();
  camera1=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,120);
  renderer1=makeRenderer($('c1'));
  addLights(scene1);
  const sunBall=ball(1.1,0xffe08a,-14,10,-16);sunBall.castShadow=false;scene1.add(sunBall);
  const glow=glowSprite('rgba(255,214,120,0.9)');glow.position.set(-14,10,-16);glow.scale.set(7,7,1);scene1.add(glow);
  // pulau (lebih luas) + tanah ber-stud
  const island=new THREE.Group();
  const studTex=(()=>{const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');
    g.fillStyle='#4b974b';g.fillRect(0,0,512,512);
    for(let i=0;i<24;i++)for(let j=0;j<24;j++){
      const x=i*21.33+10.7,y=j*21.33+10.7;
      g.fillStyle='#3d8b40';g.beginPath();g.arc(x+1.5,y+2,8,0,Math.PI*2);g.fill();
      g.fillStyle='#63c76a';g.beginPath();g.arc(x,y,6.8,0,Math.PI*2);g.fill();
    }
    const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;})();
  const islandTop=new THREE.Mesh(new THREE.CylinderGeometry(20,20,0.5,48),
    [mat(0x4b974b),new THREE.MeshLambertMaterial({map:studTex}),mat(0x4b974b)]);
  islandTop.position.set(0,-0.25,0);islandTop.castShadow=true;islandTop.receiveShadow=true;
  island.add(islandTop);
  W1.islandTop=islandTop;
  island.add(cyl(19,15,1.6,0xd9a066,0,-1.3,0));
  const tip=cone(15,3,0xc98f5f,0,-3.6,0);tip.rotation.x=Math.PI;island.add(tip);
  scene1.add(island);
  // ---------- gunung ----------
  const MT={R:12,H:9.5,TURNS:2,STEPS:48,R0:12.6,R1:3.6};
  function coneY(r){return r>=MT.R?0:MT.H*(1-r/MT.R);}
  function pathPoint(i){
    const f=i/MT.STEPS;
    const th=f*MT.TURNS*Math.PI*2;
    const r=MT.R0+(MT.R1-MT.R0)*f;
    const y=(r>=MT.R?0.2:coneY(r)+0.35);
    return {x:r*Math.sin(th),y:y,z:r*Math.cos(th),th:th,r:r};
  }
  W1.path=[];
  for(let i=0;i<=MT.STEPS;i++)W1.path.push(pathPoint(i));

const WALK_SPEED=2.6,CLIMB_SPEED=4.2;
let walkTarget=null,walkPhase=0,pendingInfo=null,pathTarget=null,pathPos=0,baseLeg=null,onPath=true;
let avY=0.2,vy=0,grounded=true,falling=false;
let toastTimer=null;
function showToast(msg){

function respawn(){

function collideSolids(){
  const p=avatar.group.position;
  for(let i=0;i<W1.solids.length;i++){
    const s=W1.solids[i];
    const dx=p.x-s.x,dz=p.z-s.z;
    const d=Math.hypot(dx,dz),min=s.r+0.5;
    if(d<min&&d>0.001){const k=min/d;p.x=s.x+dx*k;p.z=s.z+dz*k;}
  }
}
const KEYS={};
window.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();doJump();return;}KEYS[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',function(e){KEYS[e.key.toLowerCase()]=false;});
function groundPoint(e,canvas,camera){
  const r=canvas.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera);
  const hits=_rc.intersectObject(W1.islandTop,true);
  return hits.length?hits[0].point:null;
}
function pathPosToVec(p){
  const i=Math.max(0,Math.min(W1.path.length-1,Math.floor(p)));
  const j=Math.min(W1.path.length-1,i+1),f=Math.max(0,Math.min(1,p-i));
  const a=W1.path[i],b=W1.path[j];
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,z:a.z+(b.z-a.z)*f};
}
function pickPath(e){
  const r=$('c1').getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera1);
  const hits=_rc.intersectObjects(W1.steps,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&o.userData.pathIdx===undefined)o=o.parent;
  return o?o.userData.pathIdx:null;
}
function conePathIdx(e){
  const r=$('c1').getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera1);
  const hits=_rc.intersectObject(W1.mountain,true);
  if(!hits.length)return null;
  const p=hits[0].point;
  let best=0,bd=1e9;
  W1.path.forEach(function(pt,i){
    const d=Math.hypot(pt.x-p.x,pt.y-p.y,pt.z-p.z);
    if(d<bd){bd=d;best=i;}
  });
  return best;
}
function walkToPath(idx,infoKey){
  pendingInfo=null;
  if(waveT>=0){avatar.armR.rotation.z=0;avatar.head.rotation.z=0;waveT=-1;}
  if(pathPos<0.05){
    const th=W1.path[0];
    baseLeg={x:th.x,z:th.z,afterPath:idx};
    walkTarget={x:th.x,z:th.z};
  }else{
    baseLeg=null;pathTarget=idx;
  }
  if(infoKey)pendingInfo=infoKey;
}
function walkToBase(x,z){
  let d=Math.hypot(x,z);
  if(d<12.6&&d>0.001){x*=12.6/d;z*=12.6/d;}
  W1.solids.forEach(function(ob){
    const dx=x-ob.x,dz=z-ob.z,dd=Math.hypot(dx,dz),min=ob.r+0.6;
    if(dd<min){
      if(dd<=0.001){x=ob.x+min;z=ob.z;}
      else{x=ob.x+dx/dd*min;z=ob.z+dz/dd*min;}
    }
  });
  pendingInfo=null;
  if(waveT>=0){avatar.armR.rotation.z=0;avatar.head.rotation.z=0;waveT=-1;}
  if(pathPos>0.05){baseLeg={x:x,z:z,afterPath:null};pathTarget=0;}
  else{baseLeg=null;onPath=false;walkTarget={x:x,z:z};}
}

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  // avatar: napas + kedip + lambaian
  let jump=0;
  if(waveT>=0){
    waveT+=dt;
    const k=Math.min(waveT/1.4,1);
    avatar.armR.rotation.z=-2.3+Math.sin(waveT*10)*0.25*k;
    jump=Math.sin(Math.min(waveT/0.9,1)*Math.PI)*0.55;
    avatar.head.rotation.z=Math.sin(waveT*6)*0.08*k;
    if(waveT>1.5){waveT=-1;avatar.armR.rotation.z=0;avatar.head.rotation.z=0;}
  }
  // DPad: putar kamera
  if(DKEYS.left)orbit1.addTheta(dt*1.5);
  if(DKEYS.right)orbit1.addTheta(-dt*1.5);
  // bergerak: mendaki (path), jalan di base camp, atau WASD
  let mv=null;
  if(pathTarget!==null){
    const dir=Math.sign(pathTarget-pathPos);
    if(dir===0||Math.abs(pathTarget-pathPos)<0.02){
      pathPos=pathTarget;
      const done=pathTarget;pathTarget=null;
      if(done===0&&baseLeg){walkTarget={x:baseLeg.x,z:baseLeg.z};baseLeg=null;onPath=false;}
      else if(pendingInfo){showInfo(pendingInfo,true);pendingInfo=null;}
    }else{
      const step=CLIMB_SPEED*dt/2.0;
      const np=pathPos+dir*Math.min(step,Math.abs(pathTarget-pathPos));
      const a=pathPosToVec(pathPos),b=pathPosToVec(np);
      const dx=b.x-a.x,dz=b.z-a.z,dl=Math.hypot(dx,dz);
      if(dl>0.001)mv={x:dx/dl,z:dz/dl,step:Math.min(dl,CLIMB_SPEED*dt)};
      pathPos=np;
    }
  }else if(walkTarget){
    const dx=walkTarget.x-avatar.group.position.x,dz=walkTarget.z-avatar.group.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<0.08){walkTarget=null;if(baseLeg&&baseLeg.afterPath!==null){pathTarget=baseLeg.afterPath;baseLeg=null;onPath=true;}}
    else mv={x:dx/dist,z:dz/dist,step:Math.min(WALK_SPEED*dt,dist)};
  }else{
    const th=orbit1?orbit1.getTheta():0;
    if(onPath){
      if(KEYS['w']||KEYS['arrowup']||DKEYS.up){pathTarget=Math.min(W1.path.length-1,Math.floor(pathPos)+1);pendingInfo=null;}
      else if(KEYS['s']||KEYS['arrowdown']||DKEYS.down){pathTarget=Math.max(0,Math.ceil(pathPos)-1);pendingInfo=null;}
    }else{
      const fx=-Math.sin(th),fz=-Math.cos(th),rx=-fz,rz=fx;
      let kx=0,kz=0;
      if(KEYS['w']||KEYS['arrowup']||DKEYS.up){kx+=fx;kz+=fz;}
      if(KEYS['s']||KEYS['arrowdown']||DKEYS.down){kx-=fx;kz-=fz;}
      if(KEYS['d']||KEYS['arrowright']){kx+=rx;kz+=rz;}
      if(KEYS['a']||KEYS['arrowleft']){kx-=rx;kz-=rz;}
      const kl=Math.hypot(kx,kz);
      if(kl>0.01){mv={x:kx/kl,z:kz/kl,step:WALK_SPEED*dt};pendingInfo=null;}
    }
  }
  if(falling)mv=null;
  const groundY=onPath?pathPosToVec(pathPos).y:0;
  if(mv){
    const targetRot=Math.atan2(mv.x,mv.z);
    let dr=targetRot-avatar.group.rotation.y;
    while(dr>Math.PI)dr-=Math.PI*2;
    while(dr<-Math.PI)dr+=Math.PI*2;
    avatar.group.rotation.y+=dr*Math.min(1,dt*10);
    avatar.group.position.x+=mv.x*mv.step;
    avatar.group.position.z+=mv.z*mv.step;
    if(!onPath){
      const dd=Math.hypot(avatar.group.position.x,avatar.group.position.z);
      if(dd<12.6&&dd>0.001){avatar.group.position.x*=12.6/dd;avatar.group.position.z*=12.6/dd;}
      collideSolids();
      if(!falling&&Math.hypot(avatar.group.position.x,avatar.group.position.z)>20){
        falling=true;grounded=false;vy=0;
        walkTarget=null;pathTarget=null;baseLeg=null;pendingInfo=null;
      }
    }
    walkPhase+=mv.step*4.2;
    const sw=Math.sin(walkPhase);
    avatar.legL.rotation.x=sw*0.55;
    avatar.legR.rotation.x=-sw*0.55;
    avatar.armL.rotation.x=-sw*0.4;
    avatar.armR.rotation.x=sw*0.4;
  }else{
    avatar.legL.rotation.x*=0.8;
    avatar.legR.rotation.x*=0.8;
    avatar.armL.rotation.x*=0.8;
    avatar.armR.rotation.x*=0.8;
  }
  // fisika vertikal: lompat + jatuh
  if(falling){
    vy+=-14*dt;avY+=vy*dt;
    if(avY<-12)respawn();
  }else if(!grounded){
    vy+=-14*dt;avY+=vy*dt;
    if(avY<=groundY){avY=groundY;vy=0;grounded=true;}
  }else{
    avY=groundY;
  }
  avatar.group.position.y=avY+Math.sin(t*2)*0.05+(mv?Math.abs(Math.cos(walkPhase))*0.07:0)+jump;
  blinkT+=dt;
  if(blinkT>nextBlink){
    const b=blinkT-nextBlink;
    const bs=b<0.12?0.12:1;
    avatar.eyeL.scale.y=bs;avatar.eyeR.scale.y=bs;
    if(b>0.24){blinkT=0;nextBlink=2.5+Math.random()*2;avatar.eyeL.scale.y=1;avatar.eyeR.scale.y=1;}
  }
  W1.clouds.forEach(function(c){
    c.position.x+=c.userData.speed*dt;
    if(c.position.x>30)c.position.x=-30;
  });
  W1.landings.forEach(function(sp,i){
    sp.position.y=sp.userData.baseY+Math.sin(t*1.5+i*1.1)*0.1;
  });
  W1.trees.forEach(function(tr,i){tr.rotation.z=Math.sin(t*0.9+i*1.7)*0.02;});
  if(W1.flame){W1.flame.scale.y=1+Math.sin(t*9)*0.25+Math.sin(t*23)*0.1;W1.flame.rotation.y=t*2;}
  if(W1.fglow){const fs=2.6+Math.sin(t*7)*0.4;W1.fglow.scale.set(fs,fs,1);}
  W1.rocket.position.y=7.0+Math.sin(t*1.8)*0.12;
  if(W1.rocketFlame)W1.rocketFlame.scale.y=1+Math.sin(t*7)*0.3;
  if(W1.marker){
    W1.marker.position.set(avatar.group.position.x,avatar.group.position.y+0.05,avatar.group.position.z);
    const ms=1+Math.sin(t*2)*0.08;
    W1.marker.scale.set(ms,ms,1);
    W1.marker.material.opacity=0.45+Math.sin(t*2)*0.15;
  }
  if(orbit1&&W1.target){
    const fk=Math.min(1,dt*5);
    W1.target.x+=(avatar.group.position.x-W1.target.x)*fk;
    W1.target.y+=((avatar.group.position.y+1.2)-W1.target.y)*fk;
    W1.target.z+=(avatar.group.position.z-W1.target.z)*fk;
    if(Math.hypot(W1.target.x-avatar.group.position.x,W1.target.y-(avatar.group.position.y+1.2),W1.target.z-avatar.group.position.z)>3){
      W1.target.x=avatar.group.position.x;W1.target.y=avatar.group.position.y+1.2;W1.target.z=avatar.group.position.z;
    }
    orbit1.apply();
  }
  renderer1.render(scene1,camera1);
}

/* ---------- DPad (layar sentuh / HP) ---------- */
const DKEYS={up:false,down:false,left:false,right:false};
document.querySelectorAll('#dpad button').forEach(function(b){
  const d=b.getAttribute('data-d');
  if(d==='jump'){
    b.addEventListener('pointerdown',function(e){e.preventDefault();doJump();});
    b.addEventListener('contextmenu',function(e){e.preventDefault();});
    return;
  }
  function on(e){e.preventDefault();DKEYS[d]=true;}
  function off(e){e.preventDefault();DKEYS[d]=false;}
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);
  b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
});
function updateDpad(){
  const w=innerWidth,h=innerHeight;
  const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  const show=(touch||w<768)&&$('panel').classList.contains('hide');
  $('dpad').style.display=show?'grid':'none';
}
