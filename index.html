/* ---------- data info (semua data nyata) ---------- */
const INFO={

  minechart:{title:'MineChart.studio',text:'Pustaka visualisasi data untuk 13 departemen pertambangan — 134 grafik, 28 jenis. Tiap peran bisa lihat grafik yang ia butuhkan.',url:'https://dermawanpurba.github.io/MineChart.studio/',label:'Buka MineChart.studio'},
  pulau:{title:'Pulau Komunitas 3D',text:'Game survival pulau 3D di browser: mancing, berkebun, masak, dan multiplayer dengan room code. NPC Budi, Siti, dan Rama menemani di pulau.',url:'https://dermawanpurba.github.io/Game-komunitas/',label:'Main gamenya'},
  mission:{title:'Mission Control',text:'Dashboard tim AI agent saya: Anca (PM), Tono (riset), Dani (coding), Cipu (video), Jaka (QC), Mu (UI/UX). Semua tugas dan obrolan tim tercatat di sini.',url:'https://www.myjarvis.my.id',label:'Buka Mission Control'},
  sheet:{title:'Sheet-manager',text:'Buka backup SQLite ERP sebagai grid ala Google Sheets: bisa edit, simpan kembali ke SQLite, dan ekspor JSON + dump MySQL. Dibangun dengan PHP.',url:'https://github.com/Dermawanpurba/Sheet-manager',label:'Lihat di GitHub'},

};
function showInfo(key){
  const d=INFO[key]; if(!d) return;
  $('pTitle').textContent=d.title;
  $('pText').textContent=d.text;
  const a=$('pLink');
  if(d.url){a.href=d.url;a.textContent=d.label||'Buka';a.classList.remove('hide');}
  else a.classList.add('hide');
}

/* ---------- helper 3D ---------- */
function mat(color,rough){return new THREE.MeshStandardMaterial({color:color,roughness:(rough===undefined?0.85:rough),metalness:0});}
function ball(r,color,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function cyl(rt,rb,h,color,x,y,z,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function cone(r,h,color,x,y,z){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,24),mat(color));m.position.set(x||0,y||0,z||0);m.castShadow=true;return m;}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function labelSprite(text,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const g=c.getContext('2d');
  g.fillStyle=bg||'#ffffff';roundRect(g,6,14,500,100,46);g.fill();
  g.fillStyle=fg||'#3d4a6b';g.font='800 50px "Baloo 2", system-ui, sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,66);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(3.4,0.85,1);return sp;
}
function glowSprite(color){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,color);gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  return sp;
}

/* ---------- orbit seret + zoom + ketuk ---------- */
function createOrbit(canvas,camera,target,opts){
  let theta=opts.theta||0.6,phi=opts.phi||1.05,radius=opts.radius||15;
  const baseR=radius,minR=opts.minR||9,maxR=opts.maxR||24,minPhi=0.4,maxPhi=1.35;
  const pointers=new Map();
  let lx=0,ly=0,moved=0,downT=0,pinchD=0;
  function apply(){
    phi=Math.max(minPhi,Math.min(maxPhi,phi));
    radius=Math.max(minR,maxR*0.2,Math.min(maxR,radius));
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.sin(theta),
      target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(target);
  }
  function ptrDist(){
    const a=[...pointers.values()];
    return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  }
  canvas.addEventListener('pointerdown',function(e){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){lx=e.clientX;ly=e.clientY;moved=0;downT=performance.now();}
    if(pointers.size===2)pinchD=ptrDist();
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  });
  canvas.addEventListener('pointermove',function(e){
    if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const d=ptrDist();
      if(pinchD>0){radius*=pinchD/d;apply();}
      pinchD=d;return;
    }
    if(pointers.size===1){
      const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
      theta-=dx*0.005;phi-=dy*0.004;apply();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size===0){
      if(moved<8&&performance.now()-downT<400&&opts.onTap)opts.onTap(e);
      pinchD=0;
    }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',function(e){e.preventDefault();radius*=(1+Math.sign(e.deltaY)*0.08);apply();},{passive:false});
  apply();
  return {apply:apply,setRadius:function(r){radius=r;apply();},baseR:baseR,getTheta:function(){return theta;}};
}
const _rc=new THREE.Raycaster();
function pick(e,canvas,camera,roots){
  const r=canvas.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera);
  const hits=_rc.intersectObjects(roots,true);
  if(!hits.length)return null;
  let o=hits[0].object;
  while(o&&!o.userData.key)o=o.parent;
  return o;
}
function makeRenderer(canvas){
  const r=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  r.shadowMap.enabled=true;
  r.shadowMap.type=THREE.PCFSoftShadowMap;
  return r;
}
function addLights(scene){
  scene.add(new THREE.HemisphereLight(0xfff6e0,0x9fd8a8,0.85));
  const sun=new THREE.DirectionalLight(0xfff2cc,0.95);
  sun.position.set(6,10,4);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-16;sun.shadow.camera.right=16;
  sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;
  sun.shadow.camera.far=30;
  scene.add(sun);
}

/* ---------- avatar lucu ---------- */
function buildAvatar(){
  const g=new THREE.Group();
  const skin=0xffd9b3,navy=0x3d4a6b,teal=0x5ec8b8,white=0xffffff,coral=0xff8f6b,amber=0xffc46b,pink=0xffb3c1;
  function leg(side){
    const p=new THREE.Group();p.position.set(0.18*side,0.49,0);
    p.add(cyl(0.09,0.11,0.34,navy,0,-0.17,0));
    const shoe=ball(0.16,white,0,-0.40,0.06);shoe.scale.set(1,0.6,1.5);p.add(shoe);
    return p;
  }
  const legL=leg(-1),legR=leg(1);
  const body=ball(0.42,teal,0,0.82,0);body.scale.set(1,1.15,0.9);
  const belly=ball(0.3,0xffffff,0,0.78,0.24);belly.scale.set(1,1.1,0.5);
  function arm(side){
    const p=new THREE.Group();p.position.set(0.44*side,1.06,0);
    p.add(cyl(0.08,0.07,0.5,teal,0,-0.22,0));
    p.add(ball(0.11,skin,0,-0.5,0));
    return p;
  }
  const armL=arm(-1),armR=arm(1);
  const head=new THREE.Group();head.position.set(0,1.66,0);
  head.add(ball(0.55,skin,0,0,0));
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.57,24,18,0,Math.PI*2,0,Math.PI*0.5),mat(navy));
  hair.rotation.x=-0.55;hair.castShadow=true;head.add(hair);
  const cap=cyl(0.3,0.32,0.14,amber,0,0.52,0);
  const brim=cyl(0.42,0.42,0.04,amber,0,0.46,0.12);
  head.add(cap,brim);
  const eyeL=ball(0.11,white,-0.2,0.08,0.48);eyeL.scale.set(1,1,0.5);
  const eyeR=ball(0.11,white,0.2,0.08,0.48);eyeR.scale.set(1,1,0.5);
  const pupL=ball(0.055,0x2e3440,-0.2,0.08,0.53);pupL.scale.set(1,1,0.5);
  const pupR=ball(0.055,0x2e3440,0.2,0.08,0.53);pupR.scale.set(1,1,0.5);
  const blushL=ball(0.07,pink,-0.36,-0.12,0.38);blushL.scale.set(1,1,0.5);
  const blushR=ball(0.07,pink,0.36,-0.12,0.38);blushR.scale.set(1,1,0.5);
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.14,0.028,8,20,Math.PI),mat(0x8a5a3b,0.6));
  smile.position.set(0,-0.12,0.52);smile.rotation.z=Math.PI;head.add(smile);
  head.add(eyeL,eyeR,pupL,pupR,blushL,blushR);
  g.add(legL,legR,body,belly,armL,armR,head);
  g.userData.key='avatar';
  return {group:g,armR:armR,armL:armL,legL:legL,legR:legR,head:head,eyeL:eyeL,eyeR:eyeR};
}

/* ---------- DUNIA 1: pulauku (branding / CV) ---------- */
const W1={clickables:[],clouds:[],hotspots:[],trees:[],obstacles:[]};
let renderer1,scene1,camera1,avatar;
function buildWorld1(){
  scene1=new THREE.Scene();
  camera1=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
  renderer1=makeRenderer($('c1'));
  addLights(scene1);
  const sunBall=ball(1.1,0xffe08a,-8,6.2,-13);sunBall.castShadow=false;scene1.add(sunBall);
  const glow=glowSprite('rgba(255,214,120,0.9)');glow.position.set(-8,6.2,-13);glow.scale.set(7,7,1);scene1.add(glow);
  // pulau mengambang
  const island=new THREE.Group();
  const islandTop=cyl(12,12,0.5,0x7ed491,0,-0.25,0);
  island.add(islandTop);
  W1.islandTop=islandTop;
  island.add(cyl(11.4,9,1.4,0xd9a066,0,-1.2,0));
  const tip=cone(9,2.6,0xc98f5f,0,-3.2,0);tip.rotation.x=Math.PI;island.add(tip);
  scene1.add(island);
  // pepohonan
  function tree(x,z,s){
    const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s||1);
    t.add(cyl(0.18,0.26,1.1,0xb07a4a,0,0.55,0));
    t.add(ball(0.95,0x6ec98a,0,1.6,0));
    t.add(ball(0.65,0x8fd694,0.3,2.2,0.1));
    t.add(ball(0.55,0xa8e6b0,-0.35,2.05,-0.1));
    scene1.add(t);W1.trees.push(t);W1.obstacles.push({x:x,z:z,r:1.0});return t;
  }
  tree(-9.5,-2,1.1);tree(9.5,3.5,1.2);tree(-2.5,-9,1);tree(4,8.5,1.05);tree(-8,-7.5,0.95);
  // bunga-bunga
  const petals=[0xff9eb5,0xffc46b,0xc9b6f2,0xff8f6b,0x7fd1c0];
  [[-1.8,2.6],[2.2,2.9],[-3.2,1.2],[4.4,0.6],[1.4,-2.8],[-4.6,-0.6],[0.6,3.4],[3.2,-3.2],[-6.5,4.5],[6.8,-4.2],[-5,8.2],[8.6,1.5]].forEach(function(p,i){
    const f=new THREE.Group();f.position.set(p[0],0,p[1]);
    f.add(cyl(0.03,0.03,0.5,0x6ec98a,0,0.25,0));
    f.add(ball(0.18,petals[i%petals.length],0,0.55,0));
    scene1.add(f);
  });
  // pulau kecil
  const islet=new THREE.Group();islet.position.set(15,-1.4,-9);
  islet.add(cyl(1.6,1.6,0.3,0x8fd694,0,0,0));
  const itip=cone(1.5,1.2,0xc98f5f,0,-0.75,0);itip.rotation.x=Math.PI;islet.add(itip);
  islet.add(cyl(0.09,0.12,0.7,0xb07a4a,0,0.5,0));
  islet.add(ball(0.55,0x6ec98a,0,1.05,0));
  scene1.add(islet);
  // kolam
  const pond=new THREE.Group();pond.position.set(7.5,0,0);
  pond.add(cyl(2.5,2.5,0.06,0xe8d9a0,0,0.02,0));
  pond.add(cyl(2.2,2.2,0.12,0x7fc8e8,0,0.06,0));
  [[-1.6,1.2],[1.8,0.9],[-0.6,-1.9]].forEach(function(p){
    pond.add(cone(0.12,0.9,0x6ec98a,p[0],0.5,p[1]));
  });
  scene1.add(pond);
  W1.obstacles.push({x:7.5,z:0,r:2.6});
  // tenda + api unggun (ala Pulau Komunitas)
  const camp=new THREE.Group();camp.position.set(-8.5,0,0.5);
  const tent=new THREE.Mesh(new THREE.ConeGeometry(1.3,1.5,4),mat(0xff8f6b));
  tent.rotation.y=Math.PI/4;tent.position.set(0,0.75,0);tent.castShadow=true;camp.add(tent);
  camp.add(box(0.5,0.6,0.05,0x3d4a6b,0,0.35,0.92));
  const fire=new THREE.Group();fire.position.set(2.2,0,0.6);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    fire.add(ball(0.22,0x9aa5b1,Math.sin(a)*0.55,0.1,Math.cos(a)*0.55));
  }
  const log1=cyl(0.09,0.09,0.9,0xb07a4a,0,0.18,0);log1.rotation.z=Math.PI/2;log1.rotation.y=0.6;fire.add(log1);
  const log2=cyl(0.09,0.09,0.9,0xb07a4a,0,0.18,0);log2.rotation.z=Math.PI/2;log2.rotation.y=-0.6;fire.add(log2);
  const flame=cone(0.32,0.8,0xffc46b,0,0.6,0);fire.add(flame);
  const fglow=glowSprite('rgba(255,180,80,0.85)');fglow.position.set(0,0.7,0);fglow.scale.set(3,3,1);fire.add(fglow);
  camp.add(fire);
  scene1.add(camp);
  W1.flame=flame;W1.fglow=fglow;
  W1.obstacles.push({x:-8.5,z:0.5,r:1.6});
  W1.obstacles.push({x:-6.3,z:1.1,r:1.2});
  // jalan batu dari tengah ke tiap hotspot
  [[-7,6],[7,6],[-7,-6],[7,-6]].forEach(function(h){
    for(let k=1;k<=3;k++){
      const f=k/4;
      scene1.add(cyl(0.55,0.55,0.08,0xead9b0,h[0]*f,0.04,h[1]*f));
    }
  });

    if(pt)walkTo(pt.x,pt.z);

/* ---------- avatar berjalan ---------- */
const WALK_SPEED=2.6;
let walkTarget=null,walkPhase=0,pendingInfo=null;
const KEYS={};
window.addEventListener('keydown',function(e){KEYS[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',function(e){KEYS[e.key.toLowerCase()]=false;});
function groundPoint(e,canvas,camera){
  const r=canvas.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  _rc.setFromCamera(ndc,camera);
  const hits=_rc.intersectObject(W1.islandTop,true);
  return hits.length?hits[0].point:null;
}
function walkTo(x,z,infoKey){
  let px=x,pz=z;
  const d=Math.hypot(px,pz);
  if(d>11){px*=11/d;pz*=11/d;}
  W1.obstacles.forEach(function(ob){
    const dx=px-ob.x,dz=pz-ob.z,dd=Math.hypot(dx,dz);
    if(dd<ob.r){
      if(dd<=0.001){px=ob.x+ob.r;pz=ob.z;}
      else{px=ob.x+dx/dd*ob.r;pz=ob.z+dz/dd*ob.r;}
    }
  });
  const d2=Math.hypot(px,pz);
  if(d2>11){px*=11/d2;pz*=11/d2;}
  pendingInfo=null;
  if(waveT>=0){avatar.armR.rotation.z=0;avatar.head.rotation.z=0;waveT=-1;}
  walkTarget={x:px,z:pz};
  if(infoKey)pendingInfo=infoKey;
}

/* ---------- animasi, tab, resize ---------- */
let active='w1';
let orbit1=null,orbit2=null;
let waveT=-1,blinkT=0,nextBlink=2.5;
function wave(){waveT=0;}
function resizeActive(){
  const w=innerWidth,h=innerHeight;
  const boost=(w/h<0.75)?1.45:1;
  if(active==='w1'&&renderer1){renderer1.setSize(w,h,false);camera1.aspect=w/h;camera1.updateProjectionMatrix();if(orbit1)orbit1.setRadius(17*boost);}
  if(active==='w2'&&renderer2){renderer2.setSize(w,h,false);camera2.aspect=w/h;camera2.updateProjectionMatrix();if(orbit2)orbit2.setRadius(13*boost);}
}
function switchWorld(w){
  walkTarget=null;pendingInfo=null;
  active=w;
  $('world1').classList.toggle('active',w==='w1');
  $('world2').classList.toggle('active',w==='w2');
  $('tab1').classList.toggle('active',w==='w1');
  $('tab2').classList.toggle('active',w==='w2');
  document.body.classList.toggle('world2',w==='w2');
  $('hint').textContent=hintFor(w);
  showInfo(w==='w1'?'home':'projects');
  resizeActive();
}
function hintFor(w){
  const short=innerWidth<640;
  if(w==='w1')return short?'Ketuk tanah / ikon: avatar berjalan ke sana':'Ketuk tanah atau ikon — avatar berjalan ke sana • WASD untuk jalan • Seret untuk memutar • Cubit / scroll untuk zoom';
  return short?'Seret untuk memutar • Ketuk monumen':'Seret untuk memutar • Ketuk monumen proyek untuk detail • Cubit / scroll untuk zoom';
}
$('tab1').addEventListener('click',function(){switchWorld('w1');});
$('tab2').addEventListener('click',function(){switchWorld('w2');});
window.addEventListener('resize',resizeActive);

const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(active==='w1'){
    // avatar: napas + kedip + lambaian
    let jump=0;
    if(waveT>=0){
      waveT+=dt;
      const k=Math.min(waveT/1.4,1);
      avatar.armR.rotation.z=-2.3+Math.sin(waveT*10)*0.25*k;
      jump=Math.sin(Math.min(waveT/0.9,1)*Math.PI)*0.55;
      avatar.head.rotation.z=Math.sin(waveT*6)*0.08*k;
      if(waveT>1.5){waveT=-1;avatar.armR.rotation.z=0;avatar.head.rotation.z=0;}
    }
    // berjalan: ketuk tanah (walkTarget) atau WASD / panah
    let mv=null;
    if(walkTarget){
      const dx=walkTarget.x-avatar.group.position.x,dz=walkTarget.z-avatar.group.position.z;
      const dist=Math.hypot(dx,dz);
      if(dist<0.08){walkTarget=null;if(pendingInfo){showInfo(pendingInfo);pendingInfo=null;}}
      else mv={x:dx/dist,z:dz/dist,step:Math.min(WALK_SPEED*dt,dist)};
    }else{
      const th=orbit1?orbit1.getTheta():0.5;
      const fx=-Math.sin(th),fz=-Math.cos(th),rx=-fz,rz=fx;
      let kx=0,kz=0;
      if(KEYS['w']||KEYS['arrowup']){kx+=fx;kz+=fz;}
      if(KEYS['s']||KEYS['arrowdown']){kx-=fx;kz-=fz;}
      if(KEYS['d']||KEYS['arrowright']){kx+=rx;kz+=rz;}
      if(KEYS['a']||KEYS['arrowleft']){kx-=rx;kz-=rz;}
      const kl=Math.hypot(kx,kz);
      if(kl>0.01){mv={x:kx/kl,z:kz/kl,step:WALK_SPEED*dt};pendingInfo=null;}
    }
    if(mv){
      const targetRot=Math.atan2(mv.x,mv.z);
      let dr=targetRot-avatar.group.rotation.y;
      while(dr>Math.PI)dr-=Math.PI*2;
      while(dr<-Math.PI)dr+=Math.PI*2;
      avatar.group.rotation.y+=dr*Math.min(1,dt*10);
      avatar.group.position.x+=mv.x*mv.step;
      avatar.group.position.z+=mv.z*mv.step;
      walkPhase+=mv.step*4.2;
      const sw=Math.sin(walkPhase);
      avatar.legL.rotation.x=sw*0.55;
      avatar.legR.rotation.x=-sw*0.55;
      avatar.armL.rotation.x=-sw*0.4;
      avatar.armR.rotation.x=sw*0.4;
      avatar.group.position.y=Math.sin(t*2)*0.05+Math.abs(Math.cos(walkPhase))*0.07+jump;
    }else{
      avatar.legL.rotation.x*=0.8;
      avatar.legR.rotation.x*=0.8;
      avatar.armL.rotation.x*=0.8;
      avatar.armR.rotation.x*=0.8;
      avatar.group.position.y=Math.sin(t*2)*0.05+jump;
    }
    blinkT+=dt;
    if(blinkT>nextBlink){
      const b=blinkT-nextBlink;
      const s=b<0.12?0.12:1;
      avatar.eyeL.scale.y=s;avatar.eyeR.scale.y=s;
      if(b>0.24){blinkT=0;nextBlink=2.5+Math.random()*2;avatar.eyeL.scale.y=1;avatar.eyeR.scale.y=1;}
    }
    W1.clouds.forEach(function(c){
      c.position.x+=c.userData.speed*dt;
      if(c.position.x>20)c.position.x=-20;
    });
    W1.hotspots.forEach(function(h,i){
      h.position.y=h.userData.baseY+Math.sin(t*1.5+i*1.1)*0.12;
      h.rotation.y=Math.sin(t*0.8+i)*0.15;
    });
    W1.trees.forEach(function(tr,i){tr.rotation.z=Math.sin(t*0.9+i*1.7)*0.02;});
    if(W1.flame){W1.flame.scale.y=1+Math.sin(t*9)*0.25+Math.sin(t*23)*0.1;W1.flame.rotation.y=t*2;}
    if(W1.fglow){const fs=2.6+Math.sin(t*7)*0.4;W1.fglow.scale.set(fs,fs,1);}
    if(orbit1&&W1.target){
      const fk=Math.min(1,dt*3);
      W1.target.x+=(avatar.group.position.x-W1.target.x)*fk;
      W1.target.z+=(avatar.group.position.z-W1.target.z)*fk;
      orbit1.apply();
    }
    renderer1.render(scene1,camera1);
  }else{
    W2.rocket.position.y=0.2+Math.sin(t*1.8)*0.12;
    if(W2.flame)W2.flame.scale.y=1+Math.sin(t*7)*0.3;
    if(W2.dish)W2.dish.rotation.y+=dt*0.6;
    W2.monuments.forEach(function(m,i){
      m.position.y=m.userData.baseY+Math.sin(t*1.2+i*0.9)*0.05;
    });
    renderer2.render(scene2,camera2);
  }
}

window.DUNIA={ready:true,switchWorld:switchWorld,showInfo:showInfo,_w1:{avatar:avatar,camera:camera1,walkTo:walkTo,walkState:function(){return {target:walkTarget,x:avatar.group.position.x,z:avatar.group.position.z};},camTarget:function(){return {x:W1.target.x,z:W1.target.z};}},_w2:{camera:camera2}};
</script>
