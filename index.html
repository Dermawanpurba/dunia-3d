    function applyOutfitPreset(key) {
      const p = OUTFIT_PRESETS[key] || OUTFIT_PRESETS.pro;
      THEME_CONFIG.outfit = key;
      const sideMat = new THREE.MeshStandardMaterial({ color: p.torso, roughness: 0.55 });
      const frontMat = new THREE.MeshStandardMaterial({ map: createTorsoTexture(key), roughness: 0.52 });
      climber.torsoMesh.material = [sideMat, sideMat, sideMat, sideMat, frontMat, sideMat];

      const headSide = new THREE.MeshStandardMaterial({ color: p.head, roughness: 0.45 });
      const headFace = new THREE.MeshStandardMaterial({ map: createRobloxFaceTexture(key), roughness: 0.42 });
      climber.headMesh.material = [headSide, headSide, headSide, headSide, headFace, headSide];

      climber.packMesh.material.color.setHex(p.pack);
      climber.parts.upperArmL.userData.mat.color.setHex(p.arms);
      climber.parts.upperArmR.userData.mat.color.setHex(p.arms);
      climber.parts.lowerArmL.userData.mat.color.setHex(p.hands);
      climber.parts.lowerArmR.userData.mat.color.setHex(p.hands);
      climber.parts.upperLegL.userData.mat.color.setHex(p.legs);
      climber.parts.upperLegR.userData.mat.color.setHex(p.legs);
      climber.parts.lowerLegL.userData.mat.color.setHex(p.boots);
      climber.parts.lowerLegR.userData.mat.color.setHex(p.boots);
    }

    function applyHeadgearPreset(key) {
      THEME_CONFIG.headgear = key;
      Object.entries(climber.headgearMeshes).forEach(([k, grp]) => {
        grp.visible = (k === key);
      });
    }

    /* -------------------------------------------------------------------------
       SOLVER ANALYTICAL TWO-BONE INVERSE KINEMATICS (HUKUM KOSINUS)
       ------------------------------------------------------------------------- */
    const _ikUp = new THREE.Vector3(0, 1, 0);
    const _ikToTarget = new THREE.Vector3();
    const _ikDir = new THREE.Vector3();
    const _ikBendDir = new THREE.Vector3();
    const _ikSegDir = new THREE.Vector3();

    /**
     * Menghitung posisi sendi tengah (siku / lutut) secara analitis di world-space
     * menggunakan Hukum Kosinus & poleVector, lalu mengorientasikan kedua segmen
     * memakai quaternion.setFromUnitVectors.
     */
    function solveTwoBoneIK(rootPos, targetPos, L1, L2, poleVector, upperMesh, lowerMesh, outMidPos, outEndPos) {
      _ikToTarget.subVectors(targetPos, rootPos);
      let d = _ikToTarget.length();
      const minD = Math.abs(L1 - L2) + 0.02;
      const maxD = (L1 + L2) - 0.008;
      if (d < 0.0001) {
        _ikDir.set(0, -1, 0);
        d = minD;
      } else {
        _ikDir.copy(_ikToTarget).divideScalar(d);
        d = Math.max(minD, Math.min(maxD, d));
      }

      // Hukum Kosinus untuk sudut di root (bahu / pinggul)
      const cosAlpha = THREE.MathUtils.clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
      const sinAlpha = Math.sqrt(Math.max(0, 1 - cosAlpha * cosAlpha));

      // Arah tekukan tegak lurus terhadap vektor root->target memakai poleVector
      const proj = poleVector.dot(_ikDir);
      _ikBendDir.copy(poleVector).addScaledVector(_ikDir, -proj);
      if (_ikBendDir.lengthSq() < 0.0001) {
        _ikBendDir.set(0, 0, 1);
      } else {
        _ikBendDir.normalize();
      }

      outMidPos.copy(rootPos)
        .addScaledVector(_ikDir, L1 * cosAlpha)
        .addScaledVector(_ikBendDir, L1 * sinAlpha);

      outEndPos.copy(rootPos).addScaledVector(_ikDir, d);

      // Orientasikan segmen atas (root -> mid)
      upperMesh.position.copy(rootPos);
      _ikSegDir.subVectors(outMidPos, rootPos).normalize();
      upperMesh.quaternion.setFromUnitVectors(_ikUp, _ikSegDir);

      // Orientasikan segmen bawah (mid -> end)
      lowerMesh.position.copy(outMidPos);
      _ikSegDir.subVectors(outEndPos, outMidPos).normalize();
      lowerMesh.quaternion.setFromUnitVectors(_ikUp, _ikSegDir);
    }

    /* -------------------------------------------------------------------------
       PHYSICS CAPSULE COLLISION CLEARANCE (MENCEGAH CLIPPING KAPAK ES & TUBUH)
       ------------------------------------------------------------------------- */
    const _capAB = new THREE.Vector3();
    const _capAP = new THREE.Vector3();
    const _capClosest = new THREE.Vector3();
    const _capDelta = new THREE.Vector3();

    function pushPointOutOfCapsule(pt, segA, segB, capsuleRadius) {
      _capAB.subVectors(segB, segA);
      const lenSq = _capAB.lengthSq();
      let t = 0;
      if (lenSq > 0.00001) {
        _capAP.subVectors(pt, segA);
        t = Math.max(0, Math.min(1, _capAP.dot(_capAB) / lenSq));
      }
      _capClosest.copy(segA).addScaledVector(_capAB, t);
      _capDelta.subVectors(pt, _capClosest);
      const dist = _capDelta.length();
      if (dist < capsuleRadius) {
        if (dist < 0.0001) {
          _capDelta.set(0, 0, 1);
        } else {
          _capDelta.divideScalar(dist);
        }
        pt.copy(_capClosest).addScaledVector(_capDelta, capsuleRadius);
      }
    }

    /**
     * Membangun bounding capsule world-space untuk torso, paha kiri/kanan,
     * dan betis kiri/kanan, lalu memproyeksikan titik kurva Kapak Es keluar
     * mengikuti normal luar agar alat tidak pernah menembus tubuh/kaki!
     */
    function enforceLegAndTorsoClearance(axePoints, capsules) {
      for (let i = 0; i < axePoints.length; i++) {
        const pt = axePoints[i];
        for (let c = 0; c < capsules.length; c++) {
          const cap = capsules[c];
          pushPointOutOfCapsule(pt, cap.a, cap.b, cap.r);
        }
      }
    }

    // Buffer titik kerja IK agar zero-GC per frame
    const _wHipL = new THREE.Vector3(), _wHipR = new THREE.Vector3();
    const _wShL = new THREE.Vector3(), _wShR = new THREE.Vector3();
    const _wPelvis = new THREE.Vector3(), _wNeck = new THREE.Vector3();
    const _tFootL = new THREE.Vector3(), _tFootR = new THREE.Vector3();
    const _tHandL = new THREE.Vector3(), _tHandR = new THREE.Vector3();
    const _kneeL = new THREE.Vector3(), _kneeR = new THREE.Vector3();
    const _ankleL = new THREE.Vector3(), _ankleR = new THREE.Vector3();
    const _elbowL = new THREE.Vector3(), _elbowR = new THREE.Vector3();
    const _wristL = new THREE.Vector3(), _wristR = new THREE.Vector3();
    const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
    const _poleKnee = new THREE.Vector3(), _poleElbowL = new THREE.Vector3(), _poleElbowR = new THREE.Vector3();
    const _axeCtrlPts = Array.from({ length: 9 }, () => new THREE.Vector3());

    function updateClimberIKAndIceAxe(dt, animState) {
      // Update world matrices tubuh sebelum mengambil anchor bahu/pinggul
      climber.root.updateMatrixWorld(true);

      climber.anchors.hipL.getWorldPosition(_wHipL);
      climber.anchors.hipR.getWorldPosition(_wHipR);
      climber.anchors.shoulderL.getWorldPosition(_wShL);
      climber.anchors.shoulderR.getWorldPosition(_wShR);
      climber.pelvis.getWorldPosition(_wPelvis);
      climber.anchors.neck.getWorldPosition(_wNeck);

      // Basis arah karakter
      _fwd.set(0, 0, 1).applyQuaternion(climber.root.quaternion).normalize();
      _right.set(1, 0, 0).applyQuaternion(climber.root.quaternion).normalize();

      const stride = animState.stridePhase;
      const moveAmp = animState.moveAmp;
      const isClimb = animState.isClimbing;
      const isJump = animState.isJumping;
      const isPlanting = animState.isPlanting;
      const prepFlourish = animState.prepFlourish || 0;

      // 1. Hitung target IK kaki kiri & kanan
      const basePos = climber.root.position;
      if (isClimb) {
        // Gerakan panjat tebing bergantian menggapai pijakan
        const liftL = Math.max(0, Math.sin(stride)) * 0.72;
        const liftR = Math.max(0, Math.sin(stride + Math.PI)) * 0.72;
        _tFootL.copy(basePos).addScaledVector(_right, -0.52).addScaledVector(_fwd, 0.38).addScaledVector(_up, 0.25 + liftL);
        _tFootR.copy(basePos).addScaledVector(_right, 0.52).addScaledVector(_fwd, 0.38).addScaledVector(_up, 0.25 + liftR);
      } else if (isJump) {
        _tFootL.copy(basePos).addScaledVector(_right, -0.45).addScaledVector(_fwd, 0.45).addScaledVector(_up, 0.52);
        _tFootR.copy(basePos).addScaledVector(_right, 0.45).addScaledVector(_fwd, -0.35).addScaledVector(_up, 0.28);
      } else {
        const stepL = Math.sin(stride) * 0.78 * moveAmp;
        const stepR = Math.sin(stride + Math.PI) * 0.78 * moveAmp;
        const liftL = Math.max(0, Math.cos(stride)) * 0.42 * moveAmp;
        const liftR = Math.max(0, Math.cos(stride + Math.PI)) * 0.42 * moveAmp;
        _tFootL.copy(basePos).addScaledVector(_right, -0.42).addScaledVector(_fwd, stepL).addScaledVector(_up, 0.06 + liftL);
        _tFootR.copy(basePos).addScaledVector(_right, 0.42).addScaledVector(_fwd, stepR).addScaledVector(_up, 0.06 + liftR);
      }

      // Pole vector lutut selalu mengarah ke depan
      _poleKnee.copy(_fwd).addScaledVector(_up, 0.12).normalize();
      solveTwoBoneIK(_wHipL, _tFootL, climber.legL1, climber.legL2, _poleKnee, climber.parts.upperLegL, climber.parts.lowerLegL, _kneeL, _ankleL);
      solveTwoBoneIK(_wHipR, _tFootR, climber.legL1, climber.legL2, _poleKnee, climber.parts.upperLegR, climber.parts.lowerLegR, _kneeR, _ankleR);

      // 2. Hitung target IK tangan kiri & kanan
      if (isPlanting) {
        // Kedua tangan memegang tiang Bendera Puncak & menancapkan ke soket
        const flagPoleBase = summitFlagGroup.position;
        _tHandR.set(flagPoleBase.x, flagPoleBase.y + 1.35, flagPoleBase.z).addScaledVector(_right, 0.14);
        _tHandL.set(flagPoleBase.x, flagPoleBase.y + 0.85, flagPoleBase.z).addScaledVector(_right, -0.14);
      } else if (isClimb) {
        // Mencari pegangan panjat terdekat di depan karakter untuk diraih secara bergantian!
        const reachL = Math.max(0, Math.sin(stride + Math.PI)) * 0.85;
        const reachR = Math.max(0, Math.sin(stride)) * 0.85;
        _tHandL.copy(_wShL).addScaledVector(_fwd, 0.82).addScaledVector(_up, 0.55 + reachL).addScaledVector(_right, -0.22);
        _tHandR.copy(_wShR).addScaledVector(_fwd, 0.82).addScaledVector(_up, 0.55 + reachR).addScaledVector(_right, 0.22);

        // Snap halus ke 3D climbing hold jika dekat
        for (let i = 0; i < climbingHolds.length; i++) {
          const h = climbingHolds[i];
          if (h.distanceTo(_tHandL) < 1.35) _tHandL.lerp(h, 0.55);
          if (h.distanceTo(_tHandR) < 1.35) _tHandR.lerp(h, 0.55);
        }
      } else if (prepFlourish > 0.001) {
        // Fase 1 Basecamp: Tangan kanan mengayun gagah Kapak Es ke depan/atas (tanpa menembus kaki!)
        const swingAngle = Math.sin(prepFlourish * Math.PI) * 0.9;
        _tHandR.copy(_wShR)
          .addScaledVector(_fwd, 0.92)
          .addScaledVector(_right, 0.34)
          .addScaledVector(_up, -0.15 + swingAngle * 0.95);
        _tHandL.copy(_wShL)
          .addScaledVector(_fwd, 0.55)
          .addScaledVector(_right, -0.28)
          .addScaledVector(_up, -0.45 + Math.sin(prepFlourish * Math.PI) * 0.25);
      } else {
        // Berjalan / Berlari / Siaga di scroll = 0.0
        const armSwingL = Math.sin(stride + Math.PI) * 0.65 * moveAmp;
        const armSwingR = Math.sin(stride) * 0.42 * moveAmp;
        _tHandL.copy(_wShL)
          .addScaledVector(_fwd, 0.35 + armSwingL)
          .addScaledVector(_right, -0.24)
          .addScaledVector(_up, -0.78 + Math.abs(armSwingL) * 0.25);
        // Tangan kanan memegang Kapak Es selalu mengarah ke DEPAN-KANAN secara natural (bahkan di scroll = 0.0!)
        _tHandR.copy(_wShR)
          .addScaledVector(_fwd, 0.78 + armSwingR)
          .addScaledVector(_right, 0.34)
          .addScaledVector(_up, -0.45 + (isJump ? 0.65 : 0.0));
      }

      _poleElbowL.copy(_fwd).multiplyScalar(-0.7).addScaledVector(_right, -0.6).addScaledVector(_up, -0.2).normalize();
      _poleElbowR.copy(_fwd).multiplyScalar(-0.7).addScaledVector(_right, 0.6).addScaledVector(_up, -0.2).normalize();
      solveTwoBoneIK(_wShL, _tHandL, climber.armL1, climber.armL2, _poleElbowL, climber.parts.upperArmL, climber.parts.lowerArmL, _elbowL, _wristL);
      solveTwoBoneIK(_wShR, _tHandR, climber.armL1, climber.armL2, _poleElbowR, climber.parts.upperArmR, climber.parts.lowerArmR, _elbowR, _wristR);

      // 3. Perbarui Kapak Es 8-segmen CatmullRomCurve3 + Physics Capsule Clearance
      climber.iceAxeGroup.visible = !isPlanting;
      if (!isPlanting) {
        // Hitung kecepatan tangan untuk efek lentur (lag/kick) dinamis pada batang kapak es
        const handVel = _capDelta.subVectors(_wristR, climber.prevHandPos);
        if (dt > 0.001 && handVel.length() < 6.0) {
          handVel.divideScalar(dt);
          climber.iceAxeVelocityLag.lerp(handVel.clampLength(0, 12), Math.min(1, dt * 8));
        }
        climber.prevHandPos.copy(_wristR);

        // Arah utama kapak es: selalu mengarah ke DEPAN & ATAS (tidak pernah menusuk ke belakang di antara kaki!)
        const axeDir = new THREE.Vector3()
          .copy(_fwd).multiplyScalar(0.72)
          .addScaledVector(_up, isClimb ? 0.85 : 0.62)
          .addScaledVector(_right, 0.28)
          .normalize();

        const axeLen = 1.85;
        for (let i = 0; i < _axeCtrlPts.length; i++) {
          const u = i / (_axeCtrlPts.length - 1);
          const flex = u * u * 0.022;
          _axeCtrlPts[i].copy(_wristR)
            .addScaledVector(axeDir, (u - 0.14) * axeLen)
            .addScaledVector(climber.iceAxeVelocityLag, -flex);
        }

        // Bangun bounding capsule tubuh & kaki setelah IK selesai
        const bodyCapsules = [
          { a: _wPelvis, b: _wNeck, r: 0.86 },
          { a: _wHipL, b: _kneeL, r: 0.50 },
          { a: _kneeL, b: _ankleL, r: 0.44 },
          { a: _wHipR, b: _kneeR, r: 0.50 },
          { a: _kneeR, b: _ankleR, r: 0.44 }
        ];
        enforceLegAndTorsoClearance(_axeCtrlPts, bodyCapsules);

        // Rebuild mesh batang kurva 8-segmen secara ringan
        const curve = new THREE.CatmullRomCurve3(_axeCtrlPts);
        const newShaftGeo = new THREE.TubeGeometry(curve, 8, 0.068, 7, false);
        climber.iceAxeShaftMesh.geometry.dispose();
        climber.iceAxeShaftMesh.geometry = newShaftGeo;

        // Posisikan kepala kapak es di ujung kurva
        const tipPos = _axeCtrlPts[_axeCtrlPts.length - 1];
        const prevTip = _axeCtrlPts[_axeCtrlPts.length - 2];
        const tipDir = _ikSegDir.subVectors(tipPos, prevTip).normalize();
        climber.iceAxeHeadGroup.position.copy(tipPos);
        climber.iceAxeHeadGroup.quaternion.setFromUnitVectors(_ikUp, tipDir);
      }

      // 4. Bayangan kontak di permukaan tanah
      const surf = getWalkableSurface(basePos.x, basePos.z, totalTime);
      const airGap = Math.max(0, basePos.y - surf.y);
      climber.groundShadow.position.set(basePos.x, surf.y + 0.08, basePos.z);
      const sScale = Math.max(0.35, 1.0 - airGap * 0.08);
      climber.groundShadow.scale.setScalar(sScale);
      climber.groundShadow.material.opacity = Math.max(0.08, 0.36 - airGap * 0.04);
    }

    /* =========================================================================
       8. KOREOGRAFI 4 FASE SCROLL & JALUR LINTASAN BERCAHAYA (CatmullRomCurve3)
       ========================================================================= */
    const trailWaypoints = [
      // Fase 1 (0.00 - 0.18): Basecamp -> Gerbang Start -> Kaki Gunung
      new THREE.Vector3(0.0, 0, 81.0),
      new THREE.Vector3(4.5, 0, 75.0),
      new THREE.Vector3(12.5, 0, 68.0),
      new THREE.Vector3(24.0, 0, 56.5),
      // Fase 2 (0.18 - 0.70): Pos 1 Jembatan Gantung -> Belokan Batu -> Panjat Tebing Pos 2
      new THREE.Vector3(38.0, 0, 41.0),
      new THREE.Vector3(46.8, 0, 23.0),
      new THREE.Vector3(BRIDGE_START.x, BRIDGE_START.y, BRIDGE_START.z),
      new THREE.Vector3(BRIDGE_MID.x, BRIDGE_MID.y - 1.05, BRIDGE_MID.z),
      new THREE.Vector3(BRIDGE_END.x, BRIDGE_END.y, BRIDGE_END.z),
      new THREE.Vector3(50.5, 0, -21.0),
      new THREE.Vector3(40.5, 0, -31.0),
      // Tebing Curam Panjat IK
      new THREE.Vector3(33.5, 0, -27.8),
      new THREE.Vector3(26.5, 0, -24.5),
      // Fase 3 (0.70 - 0.90): Punggungan Salju -> Lompatan Akhir ke Puncak
      new THREE.Vector3(16.0, 0, -29.5),
      new THREE.Vector3(0.5, 0, -31.0),
      new THREE.Vector3(-14.0, 0, -24.0),
      new THREE.Vector3(-12.5, 0, -14.0),
      // Fase 4 (0.90 - 1.00): Pelataran Puncak & Soket Bendera
      new THREE.Vector3(-4.5, PEAK_HEIGHT, -11.2),
      new THREE.Vector3(-1.35, PEAK_HEIGHT, -10.0)
    ];

    // Koreksi tinggi Y waypoint sesuai terrain/jembatan
    trailWaypoints.forEach((pt, idx) => {
      if (idx < 6 || (idx > 8 && idx < 17)) {
        pt.y = getTerrainHeight(pt.x, pt.z) + 0.05;
      }
    });

    const masterTrailCurve = new THREE.CatmullRomCurve3(trailWaypoints, false, 'catmullrom', 0.45);
    let glowingTrailMesh = null;

    function buildGlowingClimbingTrail() {
      const samplePts = masterTrailCurve.getPoints(160);
      samplePts.forEach(p => {
        const surf = getWalkableSurface(p.x, p.z, 0);
        p.y = Math.max(p.y, surf.y) + 0.18;
      });
      const smoothCurve = new THREE.CatmullRomCurve3(samplePts);
      // Jalur tebal & solid agar jelas terlihat saat menanjak
      const geo = new THREE.TubeGeometry(smoothCurve, 180, 0.32, 6, false);
      const mat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.9
      });
      glowingTrailMesh = new THREE.Mesh(geo, mat);
      scene.add(glowingTrailMesh);
    }

    /* =========================================================================
       9. SISTEM PARTIKEL & SIMULASI FISIKA REAL-TIME (BATU, KOTAK, KEMBANG API)
       ========================================================================= */
    function spawnParticleBurst(origin, colorHex, count = 22, speed = 7.5, gravity = -16) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const vels = [];
      for (let i = 0; i < count; i++) {
        positions[i * 3] = origin.x;
        positions[i * 3 + 1] = origin.y;
        positions[i * 3 + 2] = origin.z;
        const theta = Math.random() * Math.PI * 2;
        const upBias = 0.35 + Math.random() * 0.9;
        const spd = speed * (0.4 + Math.random() * 0.8);
        vels.push(new THREE.Vector3(Math.cos(theta) * spd, upBias * spd, Math.sin(theta) * spd));
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: colorHex,
        size: 0.42,
        transparent: true,
        opacity: 1.0
      });
      const pts = new THREE.Points(geo, mat);
      scene.add(pts);
      particleSystems.push({ mesh: pts, vels, gravity, life: 1.0, maxLife: 1.0 + Math.random() * 0.5 });
    }

    function spawnFireworksCelebration() {
      const colors = [0xef4444, 0xfacc15, 0x38bdf8, 0x22c55e, 0xe879f9];
      for (let i = 0; i < 5; i++) {
        const offset = new THREE.Vector3(
          SOCKET_POS.x + (Math.random() - 0.5) * 14,
          PEAK_HEIGHT + 5.5 + Math.random() * 7.5,
          SOCKET_POS.z + (Math.random() - 0.5) * 14
        );
        spawnParticleBurst(offset, colors[i % colors.length], 38, 11.0, -9.5);
      }
    }

    /**
     * Spawn Batu Fisika Gelinding & Memantul dari lereng atas Gunung Dermawan.
     */
    const boulderGeoTemplate = (() => {
      const g = new THREE.DodecahedronGeometry(1.0, 1);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
        const n = 0.84 + 0.28 * Math.sin(vx * 4.1 + vy * 3.7 + vz * 2.9);
        pos.setXYZ(i, vx * n, vy * n, vz * n);
      }
      g.computeVertexNormals();
      return g;
    })();
    const boulderMat = new THREE.MeshStandardMaterial({ map: studRockTex, color: 0x64748b, roughness: 0.92, flatShading: true });

    function spawnPhysicsBoulder(customOrigin = null, customVel = null) {
      // Batasi maksimal 14 batu aktif agar tetap 60fps
      if (physicsBoulders.length >= 14) {
        const old = physicsBoulders.shift();
        scene.remove(old.mesh);
      }

      const radius = 1.15 + Math.random() * 0.95;
      const mesh = new THREE.Mesh(boulderGeoTemplate, boulderMat);
      mesh.scale.setScalar(radius);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Default spawn di lereng atas di atas Pos 2 & Zona Batu Jatuh
      const spawnAngle = customOrigin ? 0 : (-0.75 + (Math.random() - 0.5) * 0.85);
      const spawnR = 16.5 + Math.random() * 4.0;
      const pos = customOrigin ? customOrigin.clone() : new THREE.Vector3(
        PEAK_X + Math.cos(spawnAngle) * spawnR,
        0,
        PEAK_Z + Math.sin(spawnAngle) * spawnR
      );
      if (!customOrigin) {
        pos.y = getTerrainHeight(pos.x, pos.z) + radius + 3.5;
      }

      const vel = customVel ? customVel.clone() : new THREE.Vector3(
        Math.cos(spawnAngle) * (4.5 + Math.random() * 4.0),
        1.5,
        Math.sin(spawnAngle) * (4.5 + Math.random() * 4.0)
      );

      mesh.position.copy(pos);
      scene.add(mesh);

      physicsBoulders.push({
        mesh,
        pos,
        vel,
        radius,
        restitution: 0.44 + Math.random() * 0.14,
        age: 0,
        maxAge: 26
      });
    }

    /**
     * Kotak Kayu Fisika Roblox (Crates) yang dapat terdorong & terpental.
     */
    function buildPhysicsCrates() {
      const crateMat = new THREE.MeshStandardMaterial({ map: studCrateTex, roughness: 0.78 });
      const crateCoords = [
        [-8.2, 79.0], [-6.7, 79.6], [-7.5, 78.0],
        [45.5, 25.5], [47.2, 24.5],
        [36.5, -36.5], [38.2, -35.8], [32.0, -39.0],
        [5.2, -7.0], [-4.5, -6.5]
      ];

      crateCoords.forEach(([cx, cz]) => {
        const size = 1.35;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), crateMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        const cy = getTerrainHeight(cx, cz) + size * 0.5;
        mesh.position.set(cx, cy, cz);
        scene.add(mesh);
        physicsCrates.push({
          mesh,
          pos: new THREE.Vector3(cx, cy, cz),
          vel: new THREE.Vector3(),
          angVel: new THREE.Vector3(),
          halfSize: size * 0.5
        });
      });
    }

    const _nTmp = new THREE.Vector3();
    const _rollAxis = new THREE.Vector3();
    const _qStep = new THREE.Quaternion();
    let autoBoulderTimer = 2.5;

    function updatePhysicsSimulation(dt) {
      const GRAVITY = -24.0;

      // Auto-spawn batu fisika berkala di zona tebing agar dunia selalu hidup
      autoBoulderTimer -= dt;
      if (autoBoulderTimer <= 0) {
        spawnPhysicsBoulder();
        autoBoulderTimer = 8 + Math.random() * 5; // lebih jarang: 8-13 dtk
      }

      // 1. Update Batu Gelinding & Memantul
      for (let i = physicsBoulders.length - 1; i >= 0; i--) {
        const b = physicsBoulders[i];
        b.age += dt;
        if (b.age > b.maxAge || b.pos.length() > 155) {
          scene.remove(b.mesh);
          physicsBoulders.splice(i, 1);
          continue;
        }

        b.vel.y += GRAVITY * dt;
        b.pos.addScaledVector(b.vel, dt);

        const groundY = getTerrainHeight(b.pos.x, b.pos.z);
        if (b.pos.y - b.radius < groundY) {
          b.pos.y = groundY + b.radius;
          getTerrainNormal(b.pos.x, b.pos.z, _nTmp);

          const vDotN = b.vel.dot(_nTmp);
          if (vDotN < 0) {
            // Partikel debu saat benturan keras
            if (Math.abs(vDotN) > 5.5) {
              spawnParticleBurst(
                new THREE.Vector3(b.pos.x, groundY + 0.2, b.pos.z),
                groundY > 48 ? 0xf8fafc : 0xcbd5e1,
                10,
                4.2,
                -10
              );
            }
            // Pantulan koefisien restitusi
            b.vel.addScaledVector(_nTmp, -(1 + b.restitution) * vDotN);
            // Gesekan lereng halus
            b.vel.multiplyScalar(1 - Math.min(0.4, 0.35 * dt));
          }

          // Rotasi sudut sinkron sempurna dengan kecepatan translasi (omega = v / r)
          const horizSpeed = Math.hypot(b.vel.x, b.vel.z);
          if (horizSpeed > 0.1) {
            _rollAxis.crossVectors(_nTmp, b.vel).normalize();
            const omega = (horizSpeed / b.radius) * dt;
            _qStep.setFromAxisAngle(_rollAxis, omega);
            b.mesh.quaternion.premultiply(_qStep);
          }
        }
        b.mesh.position.copy(b.pos);

        // Tabrakan Batu dengan Kotak Kayu Fisika
        for (let c = 0; c < physicsCrates.length; c++) {
          const cr = physicsCrates[c];
          const minDist = b.radius + cr.halfSize * 1.15;
          const dist = b.pos.distanceTo(cr.pos);
          if (dist < minDist && dist > 0.01) {
            const pushDir = _capDelta.subVectors(cr.pos, b.pos).normalize();
            cr.vel.addScaledVector(pushDir, 11.5);
            cr.vel.y += 5.5;
            cr.angVel.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
            spawnParticleBurst(cr.pos, 0xd97706, 8, 4.5, -14);
          }
        }

        // Tabrakan Batu dengan Karakter saat Mode Eksplorasi WASD
        if (THEME_CONFIG.playMode && playerPhysics.knockbackTimer <= 0) {
          const playerCenter = _capClosest.set(playerPhysics.pos.x, playerPhysics.pos.y + 1.7, playerPhysics.pos.z);
          const distP = b.pos.distanceTo(playerCenter);
          if (distP < b.radius + 1.05) {
            const push = _capDelta.subVectors(playerCenter, b.pos).normalize();
            // Knockback lembut: tersandung, bukan terlempar jauh ke bawah
            playerPhysics.vel.x = push.x * 7;
            playerPhysics.vel.z = push.z * 7;
            playerPhysics.vel.y = 4.5;
            playerPhysics.grounded = false;
            playerPhysics.knockbackTimer = 0.75;
            spawnParticleBurst(playerCenter, 0xfef08a, 16, 6.0, -14);
            showToast('💥 Terserempet batu fisika! Jaga keseimbangan!');
          }
        }
      }

      // 2. Update Kotak Kayu Fisika (Gravitasi, Gesekan & Interaksi Player WASD)
      for (let i = 0; i < physicsCrates.length; i++) {
        const cr = physicsCrates[i];
        cr.vel.y += GRAVITY * dt;
        cr.pos.addScaledVector(cr.vel, dt);

        const gY = getTerrainHeight(cr.pos.x, cr.pos.z);
        if (cr.pos.y - cr.halfSize < gY) {
          cr.pos.y = gY + cr.halfSize;
          if (cr.vel.y < -2.2) {
            cr.vel.y *= -0.32;
          } else {
            cr.vel.y = 0;
          }
          cr.vel.x *= Math.max(0, 1 - 4.5 * dt);
          cr.vel.z *= Math.max(0, 1 - 4.5 * dt);
          cr.angVel.multiplyScalar(Math.max(0, 1 - 5.0 * dt));
        }

        // Dorongan karakter pada kotak kayu di mode WASD
        if (THEME_CONFIG.playMode) {
          const dx = cr.pos.x - playerPhysics.pos.x;
          const dz = cr.pos.z - playerPhysics.pos.z;
          const dy = Math.abs(cr.pos.y - (playerPhysics.pos.y + 1.0));
          const d = Math.hypot(dx, dz);
          if (d < cr.halfSize + 0.95 && dy < 1.8 && d > 0.01) {
            cr.vel.x += (dx / d) * 14 * dt;
            cr.vel.z += (dz / d) * 14 * dt;
            cr.vel.y = Math.max(cr.vel.y, 1.8);
          }
        }

        cr.mesh.position.copy(cr.pos);
        cr.mesh.rotation.x += cr.angVel.x * dt;
        cr.mesh.rotation.y += cr.angVel.y * dt;
        cr.mesh.rotation.z += cr.angVel.z * dt;
      }

      // 3. Update Fisika Gelombang Kain Bendera Puncak
      if (flagClothGeo && flagClothBasePos) {
        const posArr = flagClothGeo.attributes.position.array;
        for (let i = 0; i < posArr.length; i += 3) {
          const bx = flagClothBasePos[i];
          const by = flagClothBasePos[i + 1];
          const u = bx / 3.4; // 0 di tiang, 1 di ujung kain bebas
          const wave = Math.sin(bx * 2.6 - totalTime * 7.2) * 0.34 * u + Math.cos(by * 2.1 - totalTime * 5.0) * 0.08 * u;
          posArr[i + 2] = wave;
        }
        flagClothGeo.attributes.position.needsUpdate = true;
        flagClothGeo.computeVertexNormals();
      }

      // 4. Update Ayunan Jembatan Gantung Pos 1 (termasuk lendutan bobot karakter)
      const charPos = climber.root.position;
      for (let i = 0; i < bridgePlanks.length; i++) {
        const pl = bridgePlanks[i];
        const { basePos, u } = pl.userData;
        const env = Math.sin(u * Math.PI);
        const swayY = Math.sin(totalTime * 2.3 + u * Math.PI) * 0.14 * env;
        const swayRoll = Math.sin(totalTime * 1.9 + u * 2.0) * 0.045 * env;
        const dChar = Math.hypot(charPos.x - basePos.x, charPos.z - basePos.z);
        const weightDip = dChar < 3.5 ? (1 - dChar / 3.5) * 0.28 * env : 0;

        pl.position.y = basePos.y + swayY - weightDip;
        pl.rotation.z = swayRoll;
      }

      // 5. Update Bara Api Unggun & Awan Kubus
      if (campfireEmbers) {
        const pArr = campfireEmbers.geometry.attributes.position.array;
        const eData = campfireEmbers.userData.emberData;
        for (let i = 0; i < eData.length; i++) {
          const e = eData[i];
          pArr[i * 3 + 1] += e.speed * dt;
          pArr[i * 3] = e.originX + Math.sin(totalTime * 2.8 + e.phase) * 0.42;
          pArr[i * 3 + 2] = e.originZ + Math.cos(totalTime * 2.4 + e.phase) * 0.42;
          if (pArr[i * 3 + 1] > e.originY + 5.2) {
            pArr[i * 3 + 1] = e.originY;
          }
        }
        campfireEmbers.geometry.attributes.position.needsUpdate = true;
        if (campfireLight) {
          campfireLight.intensity = 4.2 + Math.sin(totalTime * 14) * 0.65;
        }
      }

      for (let i = 0; i < clouds.length; i++) {
        clouds[i].position.x += clouds[i].userData.speed * dt;
        if (clouds[i].position.x > 180) clouds[i].position.x = -180;
      }

      // 6. Update Partikel Ledakan Debu & Kembang Api
      for (let i = particleSystems.length - 1; i >= 0; i--) {
        const ps = particleSystems[i];
        ps.life -= dt / ps.maxLife;
        if (ps.life <= 0) {
          scene.remove(ps.mesh);
          ps.mesh.geometry.dispose();
          ps.mesh.material.dispose();
          particleSystems.splice(i, 1);
          continue;
        }
        const arr = ps.mesh.geometry.attributes.position.array;
        for (let j = 0; j < ps.vels.length; j++) {
          ps.vels[j].y += ps.gravity * dt;
          arr[j * 3] += ps.vels[j].x * dt;
          arr[j * 3 + 1] += ps.vels[j].y * dt;
          arr[j * 3 + 2] += ps.vels[j].z * dt;
        }
        ps.mesh.geometry.attributes.position.needsUpdate = true;
        ps.mesh.material.opacity = Math.max(0, ps.life);
      }
    }

    /* =========================================================================
       10. UPDATE MODE SCROLLYTELLING 4 FASE & MODE EKSPLORASI WASD
       ========================================================================= */
    const _camTargetPos = new THREE.Vector3();
    const _camLookTarget = new THREE.Vector3();
    const _prevTrailPt = new THREE.Vector3();
    let startJumpBurstDone = false;
    let summitLandBurstDone = false;

    // Ubah posisi di kurva jalur (trailU 0-1) menjadi progress scroll (p 0-1)
    function trailUToProgress(u) {
      if (u <= 0.16) return 0.08 + (u / 0.16) * 0.10;
      if (u <= 0.72) return 0.18 + ((u - 0.16) / 0.56) * 0.52;
      if (u <= 0.96) return 0.70 + ((u - 0.72) / 0.24) * 0.20;
      return 0.90 + ((u - 0.96) / 0.04) * 0.045;
    }

    // Bangun daftar pemberhentian tur dari papan/rambu (urutan jalur basecamp->puncak)
    function buildTourStops() {
      const order = ['TENTANG SAYA', '2. PENDIDIKAN ↑', '3. PEKERJAAN ←', '4. AI & WEB →', 'AI UNTUK SEMUA', '6. MINECHART.STUDIO →', '7. PULAU KOMUNITAS ↑', 'MISSION CONTROL', '9. SHEET-MANAGER ↗', '10. OPEN-IDM ↗', 'HALO, SAYA DERMAWAN'];
      const seen = {};
      const pts = [];
      clickableSignMeshes.forEach(m => {
        const r = m.userData.readable;
        if (!r || seen[r.title]) return;
        seen[r.title] = true;
        const v = new THREE.Vector3(); m.getWorldPosition(v);
        pts.push({ x: v.x, z: v.z, data: r });
      });
      pts.sort((a, b) => order.indexOf(a.data.title) - order.indexOf(b.data.title));
      tourStops = pts.map(pt => {
        let bestU = 0, bestD = Infinity;
        for (let i = 0; i <= 400; i++) {
          const u = i / 400;
          const q = masterTrailCurve.getPointAt(u);
          const d = (q.x - pt.x) * (q.x - pt.x) + (q.z - pt.z) * (q.z - pt.z);
          if (d < bestD) { bestD = d; bestU = u; }
        }
        return { p: Math.min(0.97, trailUToProgress(bestU)), num: 0, data: pt.data };
      });
      tourStops.sort((a, b) => a.p - b.p);
      tourStops.forEach((st, i) => { st.num = i + 1; });
    }

    function resetTour() {
      tourIndex = 0; tourPauseUntil = 0; tourRockslideDone = false;
      modalBackdrop.classList.remove('open');
    }

    function updateScrollytellingMode(dt) {
      // Tur panduan: jeda baca 3 detik — selama jeda, scroll ditahan
      const nowMs = performance.now();
      if (tourPauseUntil > 0 && nowMs >= tourPauseUntil) {
        tourPauseUntil = 0;
        modalBackdrop.classList.remove('open');
      }
      // Auto-Scroll lembut bila aktif (ditahan selama jeda baca tur)
      if (THEME_CONFIG.autoScroll && tourPauseUntil === 0) {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const nextY = window.scrollY + (maxScroll * 0.042 * dt);
        if (nextY >= maxScroll - 2) {
          THEME_CONFIG.autoScroll = false;
          updateAutoScrollBtn();
        } else {
          window.scrollTo(0, nextY);
        }
      }

      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      targetProgress = THREE.MathUtils.clamp(window.scrollY / maxScroll, 0, 1);
      smoothProgress += (targetProgress - smoothProgress) * 0.08;

      const p = smoothProgress;
      document.getElementById('progress-fill').style.width = (p * 100).toFixed(2) + '%';

      // Tur panduan: sampai di papan/rambu berikutnya -> berhenti & baca 3 detik
      // (pakai targetProgress agar pemberhentian tidak terlewat saat perangkat lambat)
      if (THEME_CONFIG.autoScroll && tourPauseUntil === 0 && tourIndex < tourStops.length && targetProgress >= tourStops[tourIndex].p && targetProgress > prevTargetP) {
        const stop = tourStops[tourIndex];
        tourIndex++;
        openBoardModal(stop.data);
        tourPauseUntil = performance.now() + tourPauseMs;
        showToast('Pos ' + stop.num + ' dari ' + tourStops.length + ' • ' + stop.data.title);
        spawnParticleBurst(climber.root.position.clone().add(new THREE.Vector3(0, 2.5, 0)), 0xfbbf24, 24, 5.0, -10);
      }
      // Tantangan: longsoran batu saat memasuki Zona Batu Jatuh
      if (THEME_CONFIG.autoScroll && !tourRockslideDone && p >= 0.42 && p < 0.52) {
        tourRockslideDone = true;
        for (let i = 0; i < 5; i++) spawnPhysicsBoulder();
        showToast('⚠ Awas! Batu jatuh menggelinding dari lereng!');
      }
      prevTargetP = targetProgress;

      // Sembunyikan hint scroll begitu user mulai mendaki
      if (p > 0.02) {
        document.getElementById('scroll-hint').classList.add('hidden');
      }

      // Pemetaan 4 Fase Koreografi (0.00 - 1.00)
      let trailU = 0;
      let isClimbing = false;
      let isJumping = false;
      let isPlanting = false;
      let prepFlourish = 0;
      let jumpArcY = 0;
      let phaseLabel = 'Fase 1: Basecamp Lembah Blox';

      if (p < 0.18) {
        // FASE 1 (0.00 - 0.18): Persiapan Basecamp, Ayunan Kapak Es, Lompatan Start
        phaseLabel = 'Fase 1: Persiapan Basecamp';
        if (p < 0.08) {
          trailU = 0.0;
          prepFlourish = p / 0.08;
        } else {
          const u1 = (p - 0.08) / 0.10;
          trailU = u1 * 0.16;
          if (u1 < 0.35) {
            isJumping = true;
            jumpArcY = Math.sin((u1 / 0.35) * Math.PI) * 2.2;
            if (!startJumpBurstDone && u1 > 0.08) {
              startJumpBurstDone = true;
              spawnParticleBurst(climber.root.position.clone().add(new THREE.Vector3(0, 0.3, 0)), 0xd6d3d1, 18, 5.2, -12);
            }
          }
        }
      } else if (p < 0.70) {
        // FASE 2 (0.18 - 0.70): Map Luas, Jembatan Gantung Pos 1 & Panjat Tebing IK Pos 2
        const u2 = (p - 0.18) / 0.52;
        trailU = 0.16 + u2 * 0.56; // 0.16 -> 0.72 pada kurva
        if (p < 0.42) {
          phaseLabel = 'Fase 2: Pos 1 Jembatan Gantung';
        } else if (p < 0.52) {
          phaseLabel = 'Fase 2: Zona Batu Jatuh';
        } else {
          phaseLabel = 'Fase 2: Panjat Tebing IK';
          isClimbing = true;
        }
      } else if (p < 0.90) {
        // FASE 3 (0.70 - 0.90): Punggungan Salju & Lompatan Parabolik Akhir
        phaseLabel = 'Fase 3: Punggungan Salju';
        const u3 = (p - 0.70) / 0.20;
        trailU = 0.72 + u3 * 0.24; // 0.72 -> 0.96
        if (u3 > 0.55) {
          phaseLabel = 'Fase 3: Lompatan Akhir Puncak';
          const ju = (u3 - 0.55) / 0.45;
          isJumping = true;
          jumpArcY = Math.sin(ju * Math.PI) * 4.8;
          if (ju > 0.92 && !summitLandBurstDone) {
            summitLandBurstDone = true;
            spawnParticleBurst(climber.root.position.clone(), 0xf8fafc, 22, 6.2, -12);
          }
        }
      } else {
        // FASE 4 (0.90 - 1.00): Klimaks Puncak & Tancap Bendera ke Lubang Soket Cekung
        phaseLabel = 'Fase 4: Puncak Gunung Dermawan!';
        const u4 = (p - 0.90) / 0.10;
        trailU = 0.96 + Math.min(1, u4 / 0.45) * 0.04;
        isPlanting = true;

        // Bendera Puncak muncul dan meluncur masuk tepat ke dalam lubang soket cekung!
        summitFlagGroup.visible = true;
        const plantProgress = THREE.MathUtils.clamp((u4 - 0.35) / 0.50, 0, 1);
        const easedPlant = 1 - Math.pow(1 - plantProgress, 3);
        // Dari y = PEAK_HEIGHT + 2.8 turun masuk ke dalam soket di y = PEAK_HEIGHT + 0.1
        summitFlagGroup.position.set(
          SOCKET_POS.x,
          THREE.MathUtils.lerp(PEAK_HEIGHT + 2.75, PEAK_HEIGHT + 0.05, easedPlant),
          SOCKET_POS.z
        );

        if (plantProgress > 0.88 && !fireworksTriggered) {
          fireworksTriggered = true;
          spawnFireworksCelebration();
          showToast('🏆 Puncak Gunung Dermawan 3.800 MDPL Tercapai!');
        }
      }

      if (p < 0.88) {
        summitFlagGroup.visible = false;
        fireworksTriggered = false;
        summitLandBurstDone = false;
      }
      if (p < 0.06) {
        startJumpBurstDone = false;
      }

      // Evaluasi posisi karakter pada kurva utama
      const pt = masterTrailCurve.getPointAt(THREE.MathUtils.clamp(trailU, 0, 1));
      const surf = getWalkableSurface(pt.x, pt.z, totalTime);
      pt.y = surf.y + jumpArcY;
      climber.root.position.copy(pt);

      // Arah hadap karakter mengikuti tangent kurva (atau menghadap soket di puncak)
      if (isPlanting) {
        const toSocket = new THREE.Vector3().subVectors(SOCKET_POS, pt);
        climber.root.rotation.y = Math.atan2(toSocket.x, toSocket.z);
        climber.torso.rotation.x = 0.12;
      } else if (p < 0.08) {
        // Di Basecamp (scroll = 0.0): berdiri gagah sedikit serong ke kamera & papan pengumuman
        climber.root.rotation.y = 0.32 + Math.sin(prepFlourish * Math.PI) * 0.45;
        climber.torso.rotation.x = 0.0;
      } else {
        const tang = masterTrailCurve.getTangentAt(THREE.MathUtils.clamp(trailU, 0, 1));
        climber.root.rotation.y = Math.atan2(tang.x, tang.z);
        climber.torso.rotation.x = isClimbing ? 0.42 : (isJumping ? 0.18 : 0.08);
      }

      // Hitung animasi langkah berdasarkan perubahan posisi
      const distMoved = pt.distanceTo(_prevTrailPt);
      _prevTrailPt.copy(pt);
      const movingFactor = (p > 0.08 && p < 0.945) ? 1.0 : 0.0;
      const stridePhase = p * 128.0;

      updateClimberIKAndIceAxe(dt, {
        stridePhase,
        moveAmp: movingFactor,
        isClimbing,
        isJumping,
        isPlanting,
        prepFlourish
      });

      // Sinkronkan posisi awal mode WASD jika user sewaktu-waktu beralih mode
      playerPhysics.pos.copy(pt);
      playerPhysics.yaw = climber.root.rotation.y;

      // Update Telemetri HUD
      const mdpl = Math.round(450 + (Math.max(0, pt.y) / PEAK_HEIGHT) * (3800 - 450));
      document.getElementById('tele-alt').textContent = mdpl.toLocaleString('id-ID') + ' MDPL';
      document.getElementById('tele-phase').textContent = (THEME_CONFIG.autoScroll && tourStops.length)
        ? ('Tur ' + tourIndex + '/' + tourStops.length + ' • ' + phaseLabel)
        : phaseLabel;

      // Kamera Sinematik Sesuai Pilihan Selector
      updateScrollytellingCamera(dt, pt, p, isClimbing, isPlanting);
    }

    function updateScrollytellingCamera(dt, charPos, p, isClimbing, isPlanting) {
      if (THEME_CONFIG.cameraMode === 'orbit') {
        controls.enabled = true;
        controls.target.lerp(new THREE.Vector3(charPos.x, charPos.y + 2.2, charPos.z), Math.min(1, dt * 6));
        controls.update();
        return;
      }

      controls.enabled = false;
      const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(climber.root.quaternion);
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(climber.root.quaternion);

      if (THEME_CONFIG.cameraMode === 'overview') {
        // Sudut lebar panorama memperlihatkan luasnya dunia Gunung Dermawan
        const ang = p * Math.PI * 1.4 - 0.4;
        _camTargetPos.set(Math.sin(ang) * 108, 76, Math.cos(ang) * 108 - 5);
        _camLookTarget.set(0, 26, 5);
      } else if (THEME_CONFIG.cameraMode === 'hero') {
        // Hero Cam: dekat & dramatis dari sisi depan-samping karakter
        if (isPlanting) {
          // Sudut 45 derajat mendekat menyorot soket lubang cekung & tancap bendera!
          _camTargetPos.set(SOCKET_POS.x + 5.2, PEAK_HEIGHT + 5.2, SOCKET_POS.z + 5.2);
          _camLookTarget.set(SOCKET_POS.x, PEAK_HEIGHT + 1.0, SOCKET_POS.z);
        } else {
          _camTargetPos.copy(charPos)
            .addScaledVector(forward, 7.2)
            .addScaledVector(right, 4.6)
            .add(new THREE.Vector3(0, 3.6, 0));
          _camLookTarget.copy(charPos).add(new THREE.Vector3(0, 2.3, 0));
        }
      } else {
        // Action Cam (Default): dinamis mengikuti setiap fase koreografi
        if (p < 0.08) {
          // Basecamp: tampilkan karakter, Papan Pengumuman Basecamp, dan menjulangnya Gunung Dermawan!
          _camTargetPos.set(4.5, 5.4, 91.5);
          _camLookTarget.set(-0.5, 4.0, 74.0);
        } else if (isPlanting) {
          // Klimaks Puncak: kamera sinematik sudut 45 derajat mendekat ke soket cekung & bendera!
          const zoom = THREE.MathUtils.clamp((p - 0.90) / 0.10, 0, 1);
          const dist = THREE.MathUtils.lerp(11.5, 6.4, zoom);
          const elev = THREE.MathUtils.lerp(7.2, 5.4, zoom);
          _camTargetPos.set(SOCKET_POS.x + dist * 0.72, PEAK_HEIGHT + elev, SOCKET_POS.z + dist * 0.72);
          _camLookTarget.set(SOCKET_POS.x + 0.6, PEAK_HEIGHT + 1.25, SOCKET_POS.z - 0.5);
        } else if (isClimbing) {
          // Sudut samping-belakang memamerkan panjat tebing IK dan pegangan warna-warni
          _camTargetPos.copy(charPos)
            .addScaledVector(forward, -9.5)
            .addScaledVector(right, 6.5)
            .add(new THREE.Vector3(0, 4.8, 0));
          _camLookTarget.copy(charPos).add(new THREE.Vector3(0, 2.5, 0));
        } else {
          _camTargetPos.copy(charPos)
            .addScaledVector(forward, -12.5)
            .addScaledVector(right, 4.2)
            .add(new THREE.Vector3(0, 6.4, 0));
          _camLookTarget.copy(charPos).add(new THREE.Vector3(0, 2.4, 0));
        }
      }

      // Pastikan kamera tidak pernah menembus permukaan gunung
      const camGround = getTerrainHeight(_camTargetPos.x, _camTargetPos.z) + 2.2;
      if (_camTargetPos.y < camGround) _camTargetPos.y = camGround;

      camera.position.lerp(_camTargetPos, Math.min(1, dt * 4.8));
      controls.target.lerp(_camLookTarget, Math.min(1, dt * 6.5));
      camera.lookAt(controls.target);
    }

    /**
     * Mode Eksplorasi Bebas Karakter Roblox (WASD + Spasi + Fisika Gravitasi & Lereng).
     */
    function updatePlayMode(dt) {
      const moveF = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const moveR = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      const sprint = keys.ShiftLeft || keys.ShiftRight ? 1.48 : 1.0;

      // Arah gerak relatif terhadap kamera
      const camFwd = new THREE.Vector3();
      camera.getWorldDirection(camFwd);
      camFwd.y = 0;
      camFwd.normalize();
      const camRight = new THREE.Vector3().crossVectors(camFwd, _up).normalize();

      const moveDir = new THREE.Vector3()
        .addScaledVector(camFwd, moveF)
        .addScaledVector(camRight, moveR);

      if (playerPhysics.knockbackTimer > 0) {
        playerPhysics.knockbackTimer -= dt;
      }

      const onIce = playerPhysics.pos.y > 70; // zona salju/puncak — licin (gesekan rendah, akselerasi lambat)
      const isMoving = moveDir.lengthSq() > 0.01;
      if (isMoving && playerPhysics.knockbackTimer <= 0.2) {
        moveDir.normalize();
        const speed = 13.5 * sprint;
        playerPhysics.vel.x = THREE.MathUtils.lerp(playerPhysics.vel.x, moveDir.x * speed, Math.min(1, dt * (onIce ? 4 : 10)));
        playerPhysics.vel.z = THREE.MathUtils.lerp(playerPhysics.vel.z, moveDir.z * speed, Math.min(1, dt * (onIce ? 4 : 10)));
        const targetYaw = Math.atan2(moveDir.x, moveDir.z);
        // Smooth angular lerp
        let diff = targetYaw - playerPhysics.yaw;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        playerPhysics.yaw += diff * Math.min(1, dt * 11);
      } else {
        const drag = playerPhysics.grounded ? (onIce ? 2.5 : 9.0) : 1.5; // es: gesekan jauh lebih kecil → meluncur
        playerPhysics.vel.x *= Math.max(0, 1 - drag * dt);
        playerPhysics.vel.z *= Math.max(0, 1 - drag * dt);
      }

      // Coyote time & Lompat
      if (playerPhysics.grounded) {
        playerPhysics.coyoteTimer = 0.14;
      } else {
        playerPhysics.coyoteTimer -= dt;
      }

      if (keys.Space && playerPhysics.coyoteTimer > 0) {
        playerPhysics.vel.y = 13.2;
        playerPhysics.grounded = false;
        playerPhysics.coyoteTimer = 0;
        spawnParticleBurst(playerPhysics.pos.clone(), 0xe2e8f0, 10, 4.0, -12);
      }

      // Gravitasi
      playerPhysics.vel.y -= 26.5 * dt;

      // Hembusan angin kencang di punggungan atas (y > 60): gaya lateral yang mendorong pemain
      if (playerPhysics.pos.y > 60) {
        windTimer -= dt;
        if (windTimer <= 0) {
          windTimer = 6 + Math.random() * 4;
          windGust = 1.5; // lebih singkat
          windDir = Math.random() * Math.PI * 2;
          showToast('💨 Angin kencang di punggungan! Tahan arahmu!');
          spawnParticleBurst(playerPhysics.pos.clone().add(new THREE.Vector3(0, 2, 0)), 0xe0f2fe, 14, 9, -2);
        }
      }
      if (windGust > 0) {
        windGust -= dt;
        const wStrength = 6; // dilembutkan: dorongan total 9 u/s, masih bisa dilawan
        playerPhysics.vel.x += Math.cos(windDir) * wStrength * dt;
        playerPhysics.vel.z += Math.sin(windDir) * wStrength * dt;
      }

      // Integrasi posisi + batas map 280x280
      const prevPX = playerPhysics.pos.x, prevPZ = playerPhysics.pos.z;
      playerPhysics.pos.addScaledVector(playerPhysics.vel, dt);
      playerPhysics.pos.x = THREE.MathUtils.clamp(playerPhysics.pos.x, -132, 132);
      playerPhysics.pos.z = THREE.MathUtils.clamp(playerPhysics.pos.z, -132, 132);
      applyTentCollision(prevPX, prevPZ);
      applySolidCollision(); // objek padat: NPC, papan, pohon, pondok — tidak bisa ditembus
      applyBridgeCorridor(); // pagar sisi jembatan — tidak bisa jatuh/tembus lewat sisi dek

      const surf = getWalkableSurface(playerPhysics.pos.x, playerPhysics.pos.z, totalTime);
      if (playerPhysics.pos.y <= surf.y) {
        playerPhysics.pos.y = surf.y;
        playerPhysics.vel.y = 0;
        playerPhysics.grounded = true;
      } else {
        playerPhysics.grounded = false;
      }

      // Deteksi kemiringan tebing untuk animasi memanjat
      getTerrainNormal(playerPhysics.pos.x, playerPhysics.pos.z, _nTmp);
      const slopeSteep = (!surf.onBridge && _nTmp.y < 0.72 && isMoving);

      // Update transform & IK karakter
      climber.root.position.copy(playerPhysics.pos);
      climber.root.rotation.y = playerPhysics.yaw;
      climber.torso.rotation.x = slopeSteep ? 0.38 : (isMoving ? 0.1 : 0);

      const hSpeed = Math.hypot(playerPhysics.vel.x, playerPhysics.vel.z);
      playerPhysics.stridePhase += hSpeed * dt * 1.15;

      updateClimberIKAndIceAxe(dt, {
        stridePhase: playerPhysics.stridePhase,
        moveAmp: THREE.MathUtils.clamp(hSpeed / 10, 0, 1),
        isClimbing: slopeSteep,
        isJumping: !playerPhysics.grounded,
        isPlanting: false,
        prepFlourish: 0
      });

      // Cek apakah mencapai Puncak Gunung Dermawan di Mode WASD!
      if (playerPhysics.pos.distanceTo(SOCKET_POS) < 5.0 && !fireworksTriggered) {
        fireworksTriggered = true;
        summitFlagGroup.visible = true;
        summitFlagGroup.position.set(SOCKET_POS.x, PEAK_HEIGHT + 0.05, SOCKET_POS.z);
        spawnFireworksCelebration();
        showToast('🎉 Selamat! Kamu menaklukkan Puncak Gunung Dermawan di Mode WASD!');
      }

      // TANTANGAN: longsoran batu berkala di Zona Batu Jatuh (y 28–62) — mode main saja
      const inRockZone = playerPhysics.pos.y > 28 && playerPhysics.pos.y < 62;
      if (inRockZone) {
        rockfallTimer -= dt;
        if (rockfallTimer <= 0) {
          rockfallTimer = 9 + Math.random() * 4;
          spawnPhysicsBoulder();
          showToast('⚠ Awas! Batu jatuh dari lereng!');
        }
      } else if (rockfallTimer < 8) {
        rockfallTimer = 8; // reset saat keluar zona
      }

      // Peringatan pertama kali masuk zona es
      if (onIce && !iceToastShown) {
        iceToastShown = true;
        showToast('🧊 Licin! Salju di puncak — gerakmu meluncur, hati-hati!');
      } else if (!onIce) {
        iceToastShown = false;
      }

      // Telemetri HUD
      const mdpl = Math.round(450 + (Math.max(0, playerPhysics.pos.y) / PEAK_HEIGHT) * (3800 - 450));
      document.getElementById('tele-alt').textContent = mdpl.toLocaleString('id-ID') + ' MDPL';
      document.getElementById('tele-phase').textContent = surf.onBridge
        ? 'Mode WASD: Jembatan Gantung'
        : (mdpl > 3600 ? 'Mode WASD: Puncak Gunung Dermawan!' : 'Mode Eksplorasi WASD');

      // Kamera mengikuti karakter + bisa diputar bebas via OrbitControls
      controls.enabled = true;
      const desiredTarget = new THREE.Vector3(playerPhysics.pos.x, playerPhysics.pos.y + 2.4, playerPhysics.pos.z);
      const deltaTarget = new THREE.Vector3().subVectors(desiredTarget, controls.target);
      camera.position.addScaledVector(deltaTarget, Math.min(1, dt * 7));
      controls.target.lerp(desiredTarget, Math.min(1, dt * 7));

      const camFloor = getTerrainHeight(camera.position.x, camera.position.z) + 1.8;
      if (camera.position.y < camFloor) camera.position.y = camFloor;

      // Saat di dalam tenda, dekatkan kamera agar tidak terhalang lereng/pohon;
      // kembali ke jarak semula saat keluar tenda.
      const inTentNow = tents.some(t => {
        const d = Math.hypot(playerPhysics.pos.x - t.x, playerPhysics.pos.z - t.z);
        return d < t.radius && playerPhysics.pos.y < t.y + 2.9;
      });
      const camOff = new THREE.Vector3().subVectors(camera.position, controls.target);
      const camLen = camOff.length();
      if (inTentNow) {
        if (camDistBeforeTent === null) camDistBeforeTent = camLen;
        if (camLen > 7) {
          const nl = THREE.MathUtils.lerp(camLen, 7, Math.min(1, dt * 3));
          camOff.multiplyScalar(nl / camLen);
          camera.position.copy(controls.target).add(camOff);
        }
      } else if (camDistBeforeTent !== null) {
        if (camLen < camDistBeforeTent - 0.1) {
          const nl = THREE.MathUtils.lerp(camLen, camDistBeforeTent, Math.min(1, dt * 3));
          camOff.multiplyScalar(nl / camLen);
          camera.position.copy(controls.target).add(camOff);
        } else {
          camDistBeforeTent = null;
        }
      }
      controls.update();
    }

    /* =========================================================================
       11. INTERAKSI RAYCASTER (KLIK PAPAN 3D) & EVENT HANDLERS UI
       ========================================================================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownXY = { x: 0, y: 0 };

    function getPointerHits(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(clickableSignMeshes, false);
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownXY.x = e.clientX;
      pointerDownXY.y = e.clientY;
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      const hits = getPointerHits(e.clientX, e.clientY);
      if (hits.length > 0) {
        canvas.classList.add('pointer-hover');
      } else {
        canvas.classList.remove('pointer-hover');
      }
    });

    window.addEventListener('pointerup', (e) => {
      canvas.classList.remove('dragging');
      const moved = Math.hypot(e.clientX - pointerDownXY.x, e.clientY - pointerDownXY.y);
      if (moved < 8) {
        const hits = getPointerHits(e.clientX, e.clientY);
        if (hits.length > 0 && hits[0].object.userData.readable) {
          openBoardModal(hits[0].object.userData.readable);
        }
      }
    });

    // Modal Pembacaan Papan 3D
    const modalBackdrop = document.getElementById('board-modal-backdrop');
    function openBoardModal(data) {
      document.getElementById('modal-tag').textContent = data.type;
      document.getElementById('modal-elev').textContent = data.elevation || '';
      document.getElementById('modal-title').textContent = data.title;
      const txt = document.getElementById('modal-text');
      const ul = document.getElementById('modal-body');
      ul.innerHTML = '';
      if (data.fullText) {
        txt.textContent = data.fullText;
        txt.style.display = '';
        ul.style.display = 'none';
      } else {
        txt.style.display = 'none';
        ul.style.display = '';
        (data.lines || []).forEach(line => {
          const li = document.createElement('li');
          li.textContent = line;
          ul.appendChild(li);
        });
      }
      const link = document.getElementById('modal-link');
      if (data.url) {
        link.href = data.url;
        link.textContent = data.label || 'Buka';
        link.style.display = '';
      } else {
        link.style.display = 'none';
      }
      modalBackdrop.classList.add('open');
    }

    document.getElementById('modal-close').addEventListener('click', () => {
      modalBackdrop.classList.remove('open');
      if (tourPauseUntil > 0) tourPauseUntil = 0; // lewati jeda baca tur
    });
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.classList.remove('open');
        if (tourPauseUntil > 0) tourPauseUntil = 0; // lewati jeda baca tur
      }
    });

    // Toast Notifikasi
    let toastTimeout = null;
    function showToast(msg) {
      const el = document.getElementById('toast-msg');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => el.classList.remove('show'), 2800);
    }

    // Kontrol Pill Atas
    const camSelect = document.getElementById('cam-select');
    camSelect.addEventListener('change', (e) => {
      THEME_CONFIG.cameraMode = e.target.value;
      controls.enableZoom = (THEME_CONFIG.cameraMode === 'orbit' || THEME_CONFIG.playMode);
      showToast('Kamera: ' + e.target.options[e.target.selectedIndex].text);
    });

    const btnAutoScroll = document.getElementById('btn-autoscroll');
    function updateAutoScrollBtn() {
      btnAutoScroll.textContent = THEME_CONFIG.autoScroll ? '⏸ Jeda Scroll' : '▶ Auto-Scroll';
      btnAutoScroll.classList.toggle('active', THEME_CONFIG.autoScroll);
    }
    btnAutoScroll.addEventListener('click', () => {
      if (THEME_CONFIG.playMode) togglePlayMode(false);
      THEME_CONFIG.autoScroll = !THEME_CONFIG.autoScroll;
      if (THEME_CONFIG.autoScroll) {
        // Mulai tur dari awal bila sedang di ujung/awal halaman
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        if (window.scrollY < 50 || window.scrollY > maxScroll - 50) {
          window.scrollTo(0, 0);
          resetTour();
        }
      } else if (tourPauseUntil > 0) {
        // Dijeda manual saat sedang membaca: tutup modal & lanjutkan nanti
        tourPauseUntil = 0;
        modalBackdrop.classList.remove('open');
      }
      updateAutoScrollBtn();
    });

    const btnPlayMode = document.getElementById('btn-playmode');
    const touchControls = document.getElementById('touch-controls');
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouchDevice) touchControls.classList.add('touch-visible');

    function togglePlayMode(forceState = null) {
      THEME_CONFIG.playMode = forceState !== null ? forceState : !THEME_CONFIG.playMode;
      document.body.classList.toggle('play-mode', THEME_CONFIG.playMode);
      btnPlayMode.classList.toggle('play-active', THEME_CONFIG.playMode);
      btnPlayMode.textContent = THEME_CONFIG.playMode ? '📜 Mode Scroll' : '🎮 Mainkan (WASD)';
      controls.enableZoom = THEME_CONFIG.playMode || (THEME_CONFIG.cameraMode === 'orbit');

      if (THEME_CONFIG.playMode) {
        THEME_CONFIG.autoScroll = false;
        updateAutoScrollBtn();
        document.getElementById('scroll-hint').classList.add('hidden');
        // Tempatkan kamera tepat di belakang karakter (lebih jauh di layar tegak)
        const isPortrait = window.innerWidth < window.innerHeight;
        const camDist = isPortrait ? 17 : 11;
        const camH = isPortrait ? 7.5 : 5.8;
        const back = new THREE.Vector3(0, 0, -1).applyAxisAngle(_up, playerPhysics.yaw);
        camera.position.copy(playerPhysics.pos).addScaledVector(back, camDist).add(new THREE.Vector3(0, camH, 0));
        controls.target.copy(playerPhysics.pos).add(new THREE.Vector3(0, 2.2, 0));
        showToast('Mode WASD Aktif: WASD gerak • Spasi lompat • Shift lari • Drag putar kamera');
      } else {
        showToast('Kembali ke Mode Scrollytelling 4 Fase');
      }
    }
    btnPlayMode.addEventListener('click', () => togglePlayMode());

    // Studio Drawer
    const studioDrawer = document.getElementById('studio-drawer');
    const btnStudio = document.getElementById('btn-studio');
    btnStudio.addEventListener('click', () => {
      const open = studioDrawer.classList.toggle('open');
      btnStudio.classList.toggle('active', open);
    });
    document.getElementById('btn-close-studio').addEventListener('click', () => {
      studioDrawer.classList.remove('open');
      btnStudio.classList.remove('active');
    });

    function bindChipGroup(groupId, onSelect) {
      const container = document.getElementById(groupId);
      container.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          onSelect(btn.dataset.val);
        });
      });
    }
    bindChipGroup('lighting-group', (val) => {
      applyLightingPreset(val);
      showToast('Pencahayaan diubah ke ' + val.toUpperCase());
    });
    bindChipGroup('outfit-group', (val) => {
      applyOutfitPreset(val);
      showToast('Kostum Roblox diperbarui!');
    });
    bindChipGroup('headgear-group', (val) => {
      applyHeadgearPreset(val);
      showToast('Headgear diperbarui!');
    });

    document.getElementById('btn-spawn-boulder').addEventListener('click', () => {
      // Jatuhkan 3 batu fisika sekaligus dari punggungan atas gunung
      for (let i = 0; i < 3; i++) {
        const ang = (-0.65 + (i - 1) * 0.35);
        const origin = new THREE.Vector3(
          PEAK_X + Math.cos(ang) * 15.0,
          PEAK_HEIGHT - 1.5,
          PEAK_Z + Math.sin(ang) * 15.0
        );
        const vel = new THREE.Vector3(Math.cos(ang) * 9.5, 3.0, Math.sin(ang) * 9.5);
        spawnPhysicsBoulder(origin, vel);
      }
      showToast('🪨 3 Batu Fisika dijatuhkan dari lereng puncak!');
    });

    // Event Keyboard & Kontrol Sentuh WASD
    window.addEventListener('keydown', (e) => {
      if (e.code in keys) {
        keys[e.code] = true;
        if (THEME_CONFIG.playMode && (e.code === 'Space' || e.code.startsWith('Arrow'))) {
          e.preventDefault();
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code in keys) keys[e.code] = false;
    });

    document.querySelectorAll('#touch-controls [data-key]').forEach(btn => {
      const code = btn.dataset.key;
      const press = (e) => { e.preventDefault(); keys[code] = true; btn.classList.add('pressed'); };
      const release = (e) => { e.preventDefault(); keys[code] = false; btn.classList.remove('pressed'); };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', release);
    });

    // Responsif Resize Window
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* =========================================================================
       12. BANGUN DUNIA & LOOP ANIMASI UTAMA (60FPS)
       ========================================================================= */
    function initWorld() {
      buildTerrainAndBaseplate();
      buildDistantHorizonAndClouds();
      buildBasecamp();
      buildTentsAndNPCs();
      buildPos1SuspensionBridge();
      buildPos2ClimbingWall();
      buildSummitAndRecessedSocket();
      buildAllBoardsAndSignposts();
      buildGlowingClimbingTrail();
      buildRobloxClimber();
      buildPhysicsCrates();
      buildTourStops();

      // Spawn 3 batu awal agar fisika langsung terlihat hidup
      spawnPhysicsBoulder();
      spawnPhysicsBoulder();
      applyLightingPreset(THEME_CONFIG.lighting);
    }

    function animate(timestamp) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, Math.max(0.001, (timestamp - lastTimestamp) / 1000 || 0.016));
      lastTimestamp = timestamp;
      totalTime += dt;

      updatePhysicsSimulation(dt);

      if (THEME_CONFIG.playMode) {
        updatePlayMode(dt);
      } else {
        updateScrollytellingMode(dt);
      }
      updateTentsAndNPCs(dt);

      renderer.render(scene, camera);
    }

    window.addEventListener('load', () => {
      try {
        initWorld();
        lastTimestamp = performance.now();
        requestAnimationFrame(animate);
        // Dunia Dermawan dibuka langsung dalam Mode Mainkan (WASD)
        togglePlayMode(true);
        // Hook untuk pengujian (tidak memengaruhi tampilan)
        window.MOUNTBLOX = {
          ready: true,
          playMode: () => THEME_CONFIG.playMode,
          playerPos: () => playerPhysics.pos.toArray(),
          boardTitles: () => clickableSignMeshes.map(mm => mm.userData.readable && mm.userData.readable.title).filter(Boolean),
          boardPos: (title) => {
            const m = clickableSignMeshes.find(mm => mm.userData.readable && mm.userData.readable.title === title);
            if (!m) return null;
            const v = new THREE.Vector3(); m.getWorldPosition(v); return [v.x, v.y, v.z];
          },
          project: (x, y, z) => {
            const v = new THREE.Vector3(x, y, z).project(camera);
            return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight };
          },
          openBoard: (title) => {
            const m = clickableSignMeshes.find(mm => mm.userData.readable && mm.userData.readable.title === title);
            if (!m) return false;
            openBoardModal(m.userData.readable); return true;
          },
          tourStops: () => tourStops.map(st => ({ p: Math.round(st.p * 1000) / 1000, num: st.num, title: st.data.title })),
          tourState: () => ({ index: tourIndex, paused: tourPauseUntil > 0, rockslide: tourRockslideDone, progress: Math.round(smoothProgress * 1000) / 1000 }),
          boulders: () => physicsBoulders.length,
          setPauseMs: (ms) => { tourPauseMs = ms; },
          npcs: () => npcs.map(n => ({ name: n.name, x: Math.round(n.group.position.x * 10) / 10, z: Math.round(n.group.position.z * 10) / 10 })),
          tents: () => tents.map(t => ({ name: t.name, x: t.x, z: t.z, inside: t.inside, yaw: Math.round(t.entranceYaw * 100) / 100, r: t.radius })),
          tentHits: () => (window.__tentHits || 0),
          solids: () => solids.length,
          forceTimers: () => { rockfallTimer = 0.1; windTimer = 0.1; return true; },
          teleport: (x, z) => { const s = getWalkableSurface(x, z); playerPhysics.pos.set(x, s.y, z); playerPhysics.vel.set(0, 0, 0); return true; },
          enterTent: (name) => { const t = tents.find(tt => tt.name === name); if (!t) return false; playerPhysics.pos.set(t.x + Math.sin(t.entranceYaw) * 1.2, t.y, t.z + Math.cos(t.entranceYaw) * 1.2); playerPhysics.vel.set(0, 0, 0); return true; }
        };
      } catch (err) {
        console.error('Gagal menginisialisasi Gunung Dermawan 3D:', err);
        showToast('Terjadi kesalahan memuat WebGL 3D. Silakan muat ulang.');
      }
    });
  </script>
</body>
</html>
